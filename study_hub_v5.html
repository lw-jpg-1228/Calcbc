engineering:{name:"🔧 Ch4: Engineering",topics:[
{t:"Internet of Things (IoT)",c:`<p><span class="key">IoT</span> = devices connecting to each other and the internet. Each has a <span class="key">UID</span> (Unique Identifier).</p>
<h4>How IoT Works (4 Steps)</h4>
<ol><li><span class="key">Sensors</span> gather data (light, sound, motion, temp, humidity)</li>
<li>Communication hardware sends to <span class="key">central hub</span></li>
<li>Hub processes, compares to ideal, makes decisions</li>
<li><span class="key">User interface</span> displays data</li></ol>`},

{t:"IoT Applications",c:`<h4>Where IoT Devices Are</h4>
<ul><li><span class="key">Wearables</span> — smartwatches, fitness trackers, smart rings, smart shoes</li>
<li><span class="key">Smart homes</span> — thermostats, cameras, locks, vacuums, lights (save energy)</li>
<li><span class="key">Internet of Health Things</span> — heart monitors, blood glucose sensors, fall detection, GPS for dementia patients</li>
<li><span class="key">Smart farming</span> — soil pH, rainfall, light, temp, livestock tracking, fence monitoring</li>
<li><span class="key">Smart factories</span> — machine monitoring, robotics, predictive maintenance</li></ul>
<h4>Computer Vision</h4>
<p><span class="key">Machine learning</span> that trains computers to identify objects in images/videos. Self-driving cars, security, medical imaging.</p>`},

{t:"IoT: Pros & Cons",c:`<h4>Advantages</h4>
<ul><li>More <span class="key">efficient</span> (smart thermostats save energy)</li>
<li>Automated tasks</li><li><span class="key">Save lives</span> (real-time health alerts, fall detection)</li>
<li>Devices learn and improve</li><li>Reduces waste</li></ul>
<h4>Disadvantages</h4>
<ul><li><span class="key">Data theft</span> — hackers steal info</li>
<li><span class="key">Sensors wear out</span> — faulty readings dangerous</li>
<li><span class="key">Software outdated</span> — vulnerable</li>
<li><span class="key">Hard to repair</span> — manufacturers control parts</li>
<li><span class="key">Internet required</span></li>
<li><span class="key">Privacy concerns</span></li></ul>
<p><span class="key">Right to Repair</span>: you should be able to fix what you own.</p>`},

{t:"Cybersecurity: Threats",c:`<h4>Types of Attacks</h4>
<ul><li><span class="key">Malware</span> — viruses, trojans, spyware to steal data or damage</li>
<li><span class="key">Phishing</span> — fake messages from "trusted" sources to steal passwords</li>
<li><span class="key">Ransomware</span>:
<ul><li><span class="key">Encryption attack</span> — scrambles all files</li>
<li><span class="key">Locker attack</span> — locks you out of device</li></ul></li>
<li><span class="key">Clickbait</span> — enticing links installing malware</li></ul>`},

{t:"Cybersecurity: Protection",c:`<h4>How to Stay Safe</h4>
<ul><li><span class="key">Strong unique passwords</span> (letters + numbers + symbols)</li>
<li>NEVER share passwords</li>
<li><span class="key">2FA</span> — password + verification code</li>
<li>Keep software <span class="key">updated</span></li>
<li>Don't click suspicious links</li>
<li><span class="key">Antivirus software</span></li>
<li><span class="key">Back up files</span> (World Backup Day = March 31!)</li></ul>
<div class="note">A phishing email may look perfect — always check the sender's email address and hover over links before clicking!</div>`},

{t:"Encoding: Compression Codes",c:`<h4>What is Encoding?</h4>
<p>Info in specialized format for <span class="key">storage or transmission</span>. NOT secret — just different format.</p>
<h4>Compression Codes</h4>
<p>Fewer characters. Remove vowels: "Welcome to New Brunswick" → "Wlcm t Nw Brnswck!" saves ~1/3.</p>
<p><span class="key">JPEG</span> (Joint Photographic Experts Group) = compression for images.</p>`},

{t:"Morse Code & Run-Length Coding",c:`<h4>Morse Code</h4>
<p>Invented by <span class="key">Samuel Morse</span> (1844). Dots (.) and dashes (-). Common letters = shorter: <span class="key">E = single dot (.)</span>, T = single dash (-). This makes it a compression code!</p>
<h4>Run-Length Coding</h4>
<p>Used by fax machines. Count same-value blocks.</p>
<div class="formula">00000000111110000000 → "8, 5, 8" (3 numbers not 21!)</div>
<p>Efficient for large same-colour areas.</p>`},

{t:"Encryption: Historical",c:`<h4>Encoding vs Encryption</h4>
<p><span class="key">Encoding</span> = not secret. <span class="key">Encryption</span> = secret, only intended reader decrypts.</p>
<h4>Methods</h4>
<ul><li><span class="key">Substitution codes</span> — replace letters with others</li>
<li><span class="key">Caesar Shift Cipher</span> — shift by fixed number. Shift 3: <span class="key">DANGER = GDQJHU</span>. Used by Julius Caesar!</li>
<li><span class="key">Enigma machine</span> (WWII) — German rotating-disc substitution. Cracked at <span class="key">Bletchley Park</span> (England) by team including <span class="key">Alan Turing</span>!</li></ul>
<h4>Breaking Codes</h4>
<p><span class="key">Frequency analysis</span> — count symbol frequency. <span class="key">E = most common English letter</span>. Counter: change codes throughout message.</p>`},

{t:"Encryption: Modern",c:`<h4>Symmetric Key</h4>
<p>SAME key encrypts AND decrypts. Simpler but if key stolen → exposed.</p>
<h4>Public Key (Asymmetric)</h4>
<p>TWO keys: <span class="key">public key encrypts</span> (anyone can use), <span class="key">private key decrypts</span> (only you). MUCH more secure! Used for banking, HTTPS websites.</p>
<p>Example: Someone sends you an encrypted message using your PUBLIC key. Only YOU can read it with your PRIVATE key.</p>`},

{t:"Cryptocurrency Basics",c:`<h4>What is Cryptocurrency?</h4>
<p>Digital money without <span class="key">central bank</span>. <span class="key">Decentralized</span> = no single authority. Peer-to-peer.</p>
<h4>Bitcoin</h4>
<p>First decentralized crypto (2008). Max: <span class="key">21 million coins</span> (ever). Smallest unit = <span class="key">satoshi</span>.</p>`},

{t:"Blockchain Technology",c:`<h4>What is Blockchain?</h4>
<p>List of digital records (<span class="key">blocks</span>) chained using cryptography.</p>
<ul><li>Each block: number, <span class="key">hash (SHA-256)</span>, previous hash, timestamp, <span class="key">nonce</span>, transaction data</li>
<li>Hash = unique 64-char signature. Change ANY data → hash changes → <span class="key">invalidates ALL following blocks</span></li>
<li>First = <span class="key">genesis block</span> (Block 0)</li>
<li><span class="key">Nodes</span> = computers verifying transactions</li></ul>`},

{t:"Crypto Mining & Problems",c:`<h4>Mining</h4>
<p>Computers guess correct <span class="key">nonce</span> that makes block's hash valid. First correct = earns Bitcoin.</p>
<h4>Problems</h4>
<ul><li>Not government-guaranteed/insured</li>
<li>Can be hacked (exchanges robbed)</li>
<li>Slow vs credit cards</li>
<li><span class="key">ENORMOUS energy</span> for mining</li>
<li>Not legal tender in most countries</li></ul>`},

{t:"Engineering Design Process",c:`<h4>Steps</h4>
<ol><li><span class="key">Identify the Problem</span> — what needs solving?</li>
<li><span class="key">Research</span> — understand the issue, explore solutions</li>
<li><span class="key">Generate Ideas</span> — brainstorm, discuss with others</li>
<li><span class="key">Plan</span> — sketch design, label parts</li>
<li><span class="key">Create</span> — build prototype</li>
<li><span class="key">Test & Evaluate</span> — does it work? What to improve?</li>
<li><span class="key">Reflect & Share</span> — explain what worked, what you'd change</li></ol>
<p>This process is <span class="key">iterative</span> — repeat steps to improve! Computer simulations and physical tests in specialized environments (vacuum chambers) are used.</p>`},

{t:"Light: EM Spectrum & Properties",c:`<p>Light = part of the <span class="key">electromagnetic spectrum</span>. Speed in vacuum: <span class="key">299,792,458 m/s</span> (~300,000 km/s). Sun to Earth: 8 min 17 sec.</p>
<div class="formula">wavelength × frequency = speed of light</div>
<ul><li><span class="key">Wavelength</span> = distance between crests (metres)</li>
<li><span class="key">Frequency</span> = crests per second (Hertz)</li>
<li>Red = longest wavelength, lowest frequency</li>
<li>Violet = shortest wavelength, highest frequency</li></ul>`},

{t:"Photons & Transparency",c:`<h4>Wave-Particle Duality</h4>
<p><span class="key">Photons</span> = bundles of light energy with NO mass. Light = BOTH wave AND particle.</p>
<h4>How Light Travels</h4>
<p>Always in <span class="key">straight lines</span>. Shadows form when opaque objects block light.</p>
<ul><li><span class="key">Transparent</span> — light passes (clear glass)</li>
<li><span class="key">Translucent</span> — passes but scatters (frosted glass)</li>
<li><span class="key">Opaque</span> — blocked (wood, metal)</li></ul>`},

{t:"Additive Colour (Light)",c:`<p>Primary colours of LIGHT: <span class="key">Red, Green, Blue (RGB)</span>.</p>
<ul><li>R + G = Yellow</li><li>R + B = Magenta</li><li>G + B = Cyan</li><li>R + G + B = <span class="key">White</span></li><li>No light = Black</li></ul>
<p>Eyes have 3 types of <span class="key">cones</span> (R, G, B). TVs/phones use RGB pixels.</p>`},

{t:"Subtractive Colour & Prisms",c:`<h4>Subtractive (Pigments)</h4>
<p>Pigments ABSORB some wavelengths, REFLECT others.</p>
<ul><li><span class="key">Cyan</span> absorbs RED</li><li><span class="key">Magenta</span> absorbs GREEN</li><li><span class="key">Yellow</span> absorbs BLUE</li><li>All mixed = Black</li></ul>
<h4>Prisms & ROY G BIV</h4>
<p>White light → prism → <span class="key">Red, Orange, Yellow, Green, Blue, Indigo, Violet</span>. Each bends differently (different speed through glass).</p>`},

{t:"Reflection",c:`<div class="formula">Angle of incidence (θᵢ) = Angle of reflection (θᵣ)</div>
<p><span class="key">Normal</span> = imaginary 90° line to surface. ALL angles from the normal.</p>
<ul><li><span class="key">Specular</span> — smooth surface → one direction → clear image</li>
<li><span class="key">Diffuse</span> — rough → scatters → no clear image</li></ul>
<p>Dry road = diffuse. Wet road = specular → <span class="key">glare</span>.</p>`},

{t:"Refraction & Snell's Law",c:`<p>Light changes direction entering different material because <span class="key">speed changes</span>.</p>
<div class="formula">n = speed in vacuum ÷ speed in material</div>
<p>Air: 1.0. Water: 1.33. Glass: 1.5. Diamond: 2.42.</p>
<ul><li>DENSER (higher n) → bends <span class="key">TOWARD</span> normal</li>
<li>LESS dense → bends <span class="key">AWAY FROM</span> normal</li></ul>
<div class="formula">n₁ sin θ₁ = n₂ sin θ₂</div>`},

{t:"Lenses",c:`<h4>Convex (Biconvex)</h4>
<p>Outward (thick middle). <span class="key">Converges</span> light at focal point behind. Magnifying glasses, cameras, hyperopia.</p>
<h4>Concave (Biconcave)</h4>
<p>Inward (thin middle). <span class="key">Diverges</span> light. Focal point in front. Myopia, peepholes.</p>
<h4>Prisms</h4>
<p>Triangular glass separating white light into colours.</p>`},

{t:"The Eye: How We See",c:`<h4>Light Path (in order)</h4>
<ol><li><span class="key">Cornea</span> — starts bending</li><li><span class="key">Pupil</span> — iris adjusts size</li><li><span class="key">Lens</span> — fine-tunes focus</li><li><span class="key">Retina</span> — photoreceptors</li><li><span class="key">Optic nerve</span> — signals to brain</li><li><span class="key">Brain (visual cortex)</span> — processes image</li></ol>
<h4>Rods & Cones</h4>
<ul><li><span class="key">Cones</span> — colour, 3 types (RGB), in <span class="key">fovea</span>, need bright light</li>
<li><span class="key">Rods</span> — movement, low light, B&W, edges of retina</li></ul>
<p>Image on retina = <span class="key">upside down + reversed</span>! Brain flips it. Signals cross at <span class="key">optic chiasm</span>.</p>`},

{t:"Vision Problems & Corrections",c:`<h4>Myopia (Near-sighted)</h4>
<p>See close not far. Focus <span class="key">IN FRONT of retina</span>. Fix: <span class="key">biconcave (diverging)</span>.</p>
<h4>Hyperopia (Far-sighted)</h4>
<p>See far not close. Focus <span class="key">BEHIND retina</span>. Fix: <span class="key">biconvex (converging)</span>.</p>
<h4>Other</h4>
<ul><li><span class="key">Presbyopia</span> — age (~50+), lens stiffens. Fix: convex</li>
<li><span class="key">Astigmatism</span> — imperfect cornea curve. Fix: special lenses</li></ul>
<p>Eyeglasses → Contact lenses → <span class="key">LASIK</span> (laser reshapes cornea).</p>`},

{t:"Telescopes: Refracting & Reflecting",c:`<h4>History</h4>
<p>First patent: <span class="key">Hans Lippershey</span> (1608). <span class="key">Galileo</span> → Jupiter's moons. <span class="key">Edwin Hubble</span> (1923) proved Andromeda = separate galaxy.</p>
<h4>Refracting (Lenses)</h4>
<p><span class="key">Objective lens</span> → focal point → <span class="key">eyepiece</span> magnifies. Long focal length = long tube.</p>
<h4>Reflecting (Mirrors)</h4>
<ul><li><span class="key">Newtonian</span> — secondary at angle, eyepiece on side</li>
<li><span class="key">Cassegrain</span> — light back through hole in primary → shorter tube!</li></ul>
<p><span class="key">Catadioptric</span> = mirrors AND lenses together.</p>`},

{t:"Aperture, Focal Length & Key Concepts",c:`<h4>Aperture</h4>
<p>Diameter of opening. <span class="key">BIGGER = more light = fainter objects visible</span>. Your pupil = aperture! Optical rarely <25 cm; biggest >10 m!</p>
<h4>Focal Length</h4>
<p>Distance to focal point. <span class="key">LONGER = more magnification, smaller field of view</span>.</p>
<p>Best for faint distant objects: biggest aperture + longest focal length.</p>`},

{t:"Space Telescopes",c:`<p>Atmosphere blurs images + absorbs wavelengths.</p>
<h4>NASA Great Observatories</h4>
<ul><li><span class="key">Hubble</span> (1990) — visible + near-IR. 1M+ observations.</li>
<li><span class="key">Chandra</span> (1999) — X-rays</li>
<li><span class="key">Spitzer</span> (2003-2020) — infrared</li>
<li><span class="key">Compton</span> (1991-2000) — gamma rays. Found gamma rays in thunderstorms!</li></ul>
<h4>JWST</h4>
<p>Dec 25, 2021. Most powerful. <span class="key">Infrared</span>. At <span class="key">L2</span> (~1.5M km). Detects individual photons.</p>
<h4>Airborne</h4>
<p><span class="key">SOFIA</span> — Boeing 747, ~12 km altitude. <span class="key">SUNRISE</span> — helium balloon solar telescope.</p>`},

{t:"Canadian Light Source (Synchrotron)",c:`<p><span class="key">Saskatoon, Saskatchewan</span> (Treaty 6). Opened 2004.</p>
<p>Accelerates electrons to <span class="key">99.999998% light speed</span>. Bending → bright light for research.</p>
<h4>Components (in order)</h4>
<ol><li><span class="key">Electron gun</span> — heats tungsten >1000°C</li>
<li><span class="key">LINAC</span> — 99.9998% speed</li>
<li><span class="key">Booster ring</span> — 99.999998%</li>
<li><span class="key">Storage ring</span> — 12 straight sections + bending magnets</li>
<li><span class="key">22 beamlines</span></li></ol>
<p><span class="key">Monochromator</span> = filters to one wavelength. <span class="key">Wigglers</span> = wide X-rays. <span class="key">Undulators</span> = narrow intense X-rays.</p>
<p>Uses: soil, plants, rocks, artifacts, medicines, batteries. High schoolers use <span class="key">IDEAS beamline</span>!</p>`},

{t:"Cell Theory & Discovery",c:`<h4>Discovery</h4>
<p><span class="key">Robert Hooke</span> (1665) — cork slice through microscope → tiny box-shaped spaces like monastery "cells".</p>
<h4>Full Cell Theory (6 principles)</h4>
<ol><li>All living things = cells</li><li>Cells = basic units of life</li><li>Cells come from pre-existing cells</li><li>All cells contain <span class="key">DNA</span></li><li>Similar chemical makeup/processes</li><li><span class="key">Energy flow</span> occurs within cells</li></ol>
<h4>Cell Types</h4>
<ul><li><span class="key">Unicellular</span> — single cell (bacteria). <span class="key">Multicellular</span> — many cells (plants/animals)</li>
<li><span class="key">Eukaryotic</span> — WITH nucleus. <span class="key">Prokaryotic</span> — WITHOUT nucleus</li></ul>`},

{t:"Plant Cell: Main Organelles",c:`<ul><li><span class="key">Cell wall</span> — <span class="key">cellulose + lignin</span>. Cellulose = structure. Lignin fills spaces + helps water move.</li>
<li><span class="key">Cell membrane</span> — selectively permeable (controls entry/exit)</li>
<li><span class="key">Nucleus</span> — DNA, controls cell</li>
<li><span class="key">Chloroplasts</span> — photosynthesis. <span class="key">Chlorophyll</span> = green pigment. Evolved from ancient <span class="key">cyanobacteria</span>!</li>
<li><span class="key">Vacuole</span> — LARGE, stores water/nutrients/waste. 30-80% of cell volume. <span class="key">Turgor pressure</span> = water pushing outward (like water balloon) = keeps plant firm. Wilting = lost turgor.</li>
<li><span class="key">Mitochondria</span> — "powerhouse" — <span class="key">ATP</span> (Adenosine triphosphate) from sugar/fat</li>
<li><span class="key">Ribosomes</span> — make proteins</li>
<li><span class="key">Cytoplasm</span> — gel filling cell</li></ul>
<p>Plant cells have 3 things animals DON'T: <span class="key">cell wall, chloroplasts, large vacuole</span>.</p>`},

{t:"More Organelles & Cellulose",c:`<ul><li><span class="key">Endoplasmic Reticulum (ER)</span> — folded membrane tunnels moving proteins. <span class="key">Rough ER</span> = covered in ribosomes</li>
<li><span class="key">Golgi body</span> — stacked sacs preparing proteins to send OUT (packaging dept)</li>
<li><span class="key">Lysosome</span> — digestive center, breaks down food + recycles worn parts</li>
<li><span class="key">Nuclear membrane</span> — separates nucleus from cytoplasm</li></ul>
<h4>Cellulose Facts</h4>
<p>Humans can't digest cellulose → passes through as <span class="key">fibre</span> (keeps waste moving). Cows CAN (bacteria in stomachs). Cellulose used for <span class="key">paper, cardboard, textiles, biofuel</span> (cellulosic ethanol).</p>
<div class="note"><span class="key">Red algae</span> have <span class="key">phycobilin</span> pigment instead of chlorophyll → reddish colour!</div>`},

{t:"Parts of a Plant: Leaves & Stems",c:`<h4>Leaves</h4>
<ul><li><span class="key">Lamina (blade)</span> = flat. <span class="key">Petiole</span> = stalk</li>
<li>Large + flat = max chloroplasts exposed to sun</li>
<li><span class="key">Pine needles</span> = leaves! Small + waxy = less water loss</li>
<li><span class="key">Bracts</span> = coloured "fake petals" (poinsettia "red petals" = bracts! Real flowers = tiny yellow center)</li></ul>
<h4>Stems</h4>
<ul><li><span class="key">Nodes</span> = where buds grow. <span class="key">Internodes</span> = between</li>
<li>Support, transport water/nutrients UP + sugar DOWN, store nutrients</li>
<li><span class="key">Potato tubers = underground STEMS</span> (not roots!)</li></ul>`},

{t:"Flowers, Fruit, Seeds & Roots",c:`<h4>Flowers = Reproductive Organs</h4>
<p>Colours/scents attract pollinators. After pollination → fruit around seeds → fruit spreads seeds (animals eat).</p>
<h4>Seeds</h4>
<p>Embryo + stored food (<span class="key">cotyledon</span>) + <span class="key">seed coat</span>. Can stay dormant for years.</p>
<p>Germination needs: <span class="key">water</span> (softens coat), <span class="key">warmth</span> (activates enzymes), <span class="key">air/O₂</span> (respiration).</p>
<h4>Root Types</h4>
<ul><li><span class="key">Fibrous</span> — thin, spread wide (grasses)</li>
<li><span class="key">Taproots</span> — thick, deep (carrots)</li>
<li><span class="key">Buttress</span> — above-ground support (tropical)</li></ul>
<p>Roots need oxygen! Flooding → aerial roots.</p>`},

{t:"Photosynthesis",c:`<div class="formula">CO₂ + H₂O + light → glucose (C₆H₁₂O₆) + O₂</div>
<p>In <span class="key">chloroplasts</span>. Plants = <span class="key">autotrophs</span> (make food). Humans = <span class="key">heterotrophs</span> (eat others).</p>
<p>Glucose = <span class="key">carbohydrate</span>. Also: sucrose (table sugar), cellulose (walls), starch (stored in roots — potatoes, carrots, beets).</p>`},

{t:"Respiration",c:`<div class="formula">Glucose + O₂ → CO₂ + H₂O + ATP</div>
<p>OPPOSITE of photosynthesis. In <span class="key">mitochondria</span>. Releases energy as ATP.</p>
<p>KEY: Photosynthesis needs light. Respiration = <span class="key">24/7 with AND without light</span>!</p>`},

{t:"Transpiration & Water Movement",c:`<p>Evaporation from leaves through <span class="key">stomata</span>. Also lets in CO₂. Up to <span class="key">90%</span> of root water lost!</p>
<p><span class="key">Cuticle</span> = waxy coating preventing extra loss.</p>
<div class="note">Roots do NOT push water up. Transpiration in leaves PULLS water upward!</div>
<h4>Cooling</h4>
<p>Transpiration cools plants + air → more vapour → clouds → blocks sun → cooling.</p>
<h4>Drought</h4>
<p>Stomata close → less CO₂ → less photosynthesis → overheating.</p>
<h4>Desert Plants</h4>
<p>Cacti: thick cuticles, spines (not leaves), photosynthesis in STEMS. Prickly pear paddles = stems!</p>`},

{t:"Plant Reproduction: Sexual",c:`<h4>Flower Parts (outside → inside)</h4>
<ol><li><span class="key">Sepals</span> — protect bud</li>
<li><span class="key">Petals</span> — attract pollinators</li>
<li><span class="key">Stamens</span> (male) — <span class="key">anthers</span> on <span class="key">filaments</span> make pollen</li>
<li><span class="key">Carpel/Pistil</span> (female) — <span class="key">stigma</span> (catches pollen) → <span class="key">style</span> → <span class="key">ovary</span> (ovules)</li></ol>
<h4>Pollination</h4>
<ul><li><span class="key">Self</span> — same plant. <span class="key">Cross</span> — different plant (more diversity!)</li>
<li>Pollinators: bees, butterflies, hummingbirds, bats, wind</li></ul>`},

{t:"Plant Reproduction: Asexual",c:`<p>ONE parent → <span class="key">clones</span> (genetically identical).</p>
<ul><li><span class="key">Bulbs</span> (garlic, tulips) — underground storage</li>
<li><span class="key">Tubers</span> (potatoes) — underground stems</li>
<li><span class="key">Rhizomes</span> (ginger) — horizontal underground</li>
<li><span class="key">Stolons/runners</span> (strawberries) — horizontal above-ground</li>
<li><span class="key">Corms</span> (crocuses) — solid</li>
<li><span class="key">Fragmentation</span> — new from broken piece</li></ul>`},

{t:"Taxonomy",c:`<div class="formula">Domain → Kingdom → Phylum → Class → Order → Family → Genus → Species</div>
<p>Mnemonic: <span class="key">Dear King Philip Came Over For Good Spaghetti</span></p>
<p>3 Domains: Bacteria, Archaea, Eukarya.</p>
<p>Kingdom Plantae: multicellular, cell walls, photosynthesis.</p>
<ul><li><span class="key">Phanerogams</span> — seed plants</li>
<li><span class="key">Cryptogams</span> — non-seed (ferns, mosses, algae)</li></ul>`},

{t:"Plant Products & Uses",c:`<ul><li><span class="key">Sugar</span> — sugarcane stems</li>
<li><span class="key">Maple syrup</span> — tree sap</li>
<li><span class="key">Cinnamon</span> — bark</li>
<li><span class="key">Cork</span> — cork oak bark</li>
<li><span class="key">Rubber</span> — rubber tree latex</li>
<li><span class="key">Paper</span> — cellulose from wood</li>
<li><span class="key">Biofuel</span> — cellulosic ethanol</li>
<li><span class="key">Medicine</span> — many drugs from plants (aspirin from willow bark)</li>
<li><span class="key">Cotton</span> — from cotton plant fibres</li>
<li><span class="key">Dyes</span> — from flowers, roots, bark</li></ul>`},

{t:"Plant Adaptations Summary",c:`<h4>Adaptations by Environment</h4>
<ul><li><span class="key">Desert</span>: thick cuticle, spines, water storage stems, deep roots</li>
<li><span class="key">Rainforest</span>: drip tips, buttress roots, epiphytes grow ON others, lianas climb to canopy</li>
<li><span class="key">Boreal</span>: needles (less water loss), cone shape (snow slides off), evergreen (quick spring start), dark colour (absorb heat)</li>
<li><span class="key">Tundra</span>: low-growing, shallow roots, dark colours, fuzzy stems, rapid reproduction</li>
<li><span class="key">Aquatic</span>: flexible stems, air pockets for floating, underwater pollination</li></ul>`},

{t:"Fossil Fuels Overview",c:`<p>Most vehicle fuels come from <span class="key">fossil fuels</span> — formed from ancient dead organisms over millions of years. All are <span class="key">hydrocarbons</span> (hydrogen + carbon only). Longer chains = thicker/heavier.</p>
<p><span class="key">Liquid fuels</span>: gasoline, diesel, ethanol. <span class="key">Gaseous fuels</span>: propane, natural gas, hydrogen.</p>`},

{t:"Gasoline & Diesel",c:`<h4>Gasoline (Mogas)</h4>
<p>Most common. 4-12 carbons. <span class="key">Spark ignition</span>. Cars, trucks, vans, motorcycles, boats, ATVs. Canadian gas contains some ethanol.</p>
<h4>Diesel (Petrodiesel)</h4>
<p>2nd most common. 8-21 carbons. <span class="key">Compression ignition</span> (NO spark plug! Compressed air gets so hot it ignites). More efficient. Thicker than gasoline.</p>`},

{t:"Other Fuels",c:`<ul><li><span class="key">Aviation fuel</span> — Jet A (kerosene) for commercial, Jet B (naphtha blend) for cold weather. Naphtha = more volatile hydrocarbons.</li>
<li><span class="key">CNG</span> — mainly methane CH₄. Cheaper, cleaner.</li>
<li><span class="key">Propane (LPG)</span> — C₃H₈. Burns cleaner. BBQs, taxis. Bad-smelling <span class="key">additive for leak detection</span>!</li>
<li><span class="key">HFO (bunker fuel)</span> — very thick, needs heating. Ships/power plants.</li></ul>`},

{t:"Complete vs Incomplete Combustion",c:`<h4>Complete (enough O₂)</h4>
<div class="formula">CH₄ + 2O₂ → CO₂ + 2H₂O</div>
<p>Products: CO₂ + water. Greenhouse effect but no toxic gases.</p>
<h4>Incomplete (NOT enough O₂)</h4>
<div class="formula">4CH₄ + 5O₂ → 2CO + 8H₂O + 2C</div>
<p><span class="key">CO</span> = toxic, odourless, colourless. <span class="key">Carbon (soot)</span> = black particles.</p>`},

{t:"4-Stroke Engine Cycle",c:`<ol><li><span class="key">INTAKE</span> — fuel-air enters</li>
<li><span class="key">COMPRESSION</span> — piston squeezes</li>
<li><span class="key">POWER</span> — spark ignites → expansion pushes piston → turns <span class="key">crankshaft</span></li>
<li><span class="key">EXHAUST</span> — waste gases exit</li></ol>
<p><span class="key">Crankshaft</span> = up-down → rotational motion. Hundreds of cycles/minute!</p>
<p>Diesel: NO spark — compressed air alone ignites fuel.</p>`},

{t:"Smog & Pollutants",c:`<h4>What is Smog?</h4>
<p>"Smoke+fog". <span class="key">Particulate matter (soot)</span> + <span class="key">ground-level ozone (O₃)</span>.</p>
<h4>Direct Products</h4>
<p>CO₂, H₂O, CO (incomplete), soot (incomplete)</p>
<h4>Indirect Products (from heat)</h4>
<ul><li><span class="key">NOₓ</span> — N₂ + O₂ combine in extreme heat</li>
<li><span class="key">VOCs</span> — benzene, formaldehyde (from crude oil)</li>
<li><span class="key">SO₂</span> — from diesel</li></ul>
<div class="formula">NOₓ + VOCs + sunlight → ground-level ozone (BAD!)</div>`},

{t:"Good vs Bad Ozone & Acid Rain",c:`<h4>Two Types of Ozone</h4>
<ul><li><span class="key">Upper atmosphere</span> = GOOD (blocks UV radiation, damaged by human chemicals but recovering)</li>
<li><span class="key">Ground-level</span> = BAD (smog, breathing problems). Forms on hot sunny days.</li></ul>
<h4>Acid Rain</h4>
<div class="formula">NOₓ + SO₂ + water → acid precipitation</div>
<p>Damages plants, acidifies lakes/rivers, harms species reproduction, disrupts ecosystems.</p>`},

{t:"Smog: Health & Government Action",c:`<h4>Health Effects</h4>
<ul><li>Harder breathing (asthma)</li><li>More hospital visits</li><li>Reduced lung function</li><li>Linked to early deaths</li></ul>
<h4>Government Actions</h4>
<ul><li>Funding active transport (walking, cycling)</li>
<li>Zero-emission school/transit buses</li>
<li><span class="key">AQHI</span> (Air Quality Health Index) monitoring</li>
<li>Wildfire smoke maps</li>
<li>International partnerships</li></ul>`},

{t:"Catalytic Converters",c:`<p>Invented by <span class="key">Eugène Houdry</span> (~1950). Required since 1975. ~98% of vehicles.</p>
<p><span class="key">Ceramic honeycomb</span> coated in: <span class="key">platinum (Pt), palladium (Pd), rhodium (Rh)</span>. Resist corrosion, trigger reactions without being consumed.</p>
<h4>3 Reactions</h4>
<ul><li><span class="key">Reduction</span>: 2NO → N₂ + O₂ (NOₓ → harmless N₂)</li>
<li><span class="key">Oxidation</span>: 2CO + O₂ → 2CO₂ (toxic CO removed)</li>
<li><span class="key">Oxidation</span>: HC + O₂ → CO₂ + H₂O (unburned fuel removed)</li></ul>
<p><span class="key">Oxygen sensor</span> adjusts fuel-air ratio. Works best HOT.</p>`},

{t:"Ethanol Biofuel",c:`<p><span class="key">Ethanol (C₂H₅OH)</span> — made by <span class="key">fermentation</span> (yeast converts sugar → ethanol). In Canada: corn and wheat. Burns cleaner (less CO, soot).</p>
<p>Since 2020: Canadian gas must have <span class="key">10% renewable content</span> (usually ethanol).</p>
<p>E5 = 5%, E10 = 10%, E85 = 85% (Flex Fuel Vehicles only).</p>`},

{t:"Biodiesel & 4 Generations",c:`<h4>Biodiesel</h4>
<p>Fat + alcohol. Sources: canola, soybeans, algae, waste oil, animal fat. Since 2011: diesel needs <span class="key">2% renewable</span>.</p>
<h4>4 Generations</h4>
<ol><li><span class="key">1st</span> — food crops (corn, sugarcane)</li>
<li><span class="key">2nd</span> — non-food waste (cellulose, wood chips)</li>
<li><span class="key">3rd</span> — algae (fast, no farmland)</li>
<li><span class="key">4th</span> — genetically engineered organisms</li></ol>`},

{t:"Environmental Impact & Solutions",c:`<h4>Problems with Fossil Fuels</h4>
<ul><li><span class="key">Greenhouse effect</span> — CO₂ traps heat in atmosphere</li>
<li><span class="key">Climate change</span> — rising temperatures, extreme weather</li>
<li>Oil spills damage ecosystems</li>
<li>Non-renewable — will run out</li></ul>
<h4>Solutions</h4>
<ul><li><span class="key">Electric vehicles</span> — no tailpipe emissions</li>
<li><span class="key">Hydrogen fuel cells</span> — only produce water</li>
<li><span class="key">Biofuels</span> — renewable, lower emissions</li>
<li><span class="key">Public transit</span> — fewer vehicles per person</li>
<li><span class="key">Active transportation</span> — walking, cycling</li></ul>`},

{t:"Chemistry in Daily Life",c:`<h4>Combustion Everywhere</h4>
<ul><li>Furnaces and water heaters (natural gas)</li>
<li>Gas stoves and BBQs (propane)</li>
<li>Candles (wax combustion)</li>
<li>Campfires (wood combustion — also incomplete → smoke!)</li></ul>
<h4>Carbon Monoxide Safety</h4>
<p>CO is odourless, colourless — the "silent killer". <span class="key">CO detectors</span> in homes are essential! Sources: furnaces, fireplaces, car exhaust in enclosed garages.</p>`},

{t:"Biomes Overview",c:`<p><span class="key">Biome</span> = large area with similar climate, plants, animals. An <span class="key">ecosystem</span> = interaction of living + non-living in a specific area. NOT the same!</p>
<p>Determined by <span class="key">temperature + precipitation</span>. Also: latitude (equator = warmer) and altitude (higher = cooler).</p>
<p><span class="key">8 major terrestrial biomes</span> exist. This chapter covers 5.</p>`},

{t:"Hot Deserts: Characteristics",c:`<ul><li>Less than <span class="key">250 mm rain/year</span></li>
<li><span class="key">Extreme temp</span>: 50°C day, below 0°C night</li>
<li>~33% of land surface</li>
<li>NOT always sandy — many rocky/gravelly</li>
<li>Near <span class="key">Tropic of Cancer (30°N)</span> and <span class="key">Capricorn (30°S)</span></li>
<li>Rain often evaporates before soaking in</li>
<li>Soil: <span class="key">Aridisols</span></li></ul>
<p><span class="key">Sahara</span>: largest hot desert (9.2M km²), 11 countries, only ~25% sand dunes.</p>
<p><span class="key">Atacama</span> (South America) = driest on Earth. <span class="key">Namib</span> = SW Africa. Antarctica + Greenland = cold deserts.</p>`},

{t:"Desert Plants & Animals",c:`<h4>Plant Adaptations</h4>
<ul><li><span class="key">Cacti</span> — water in stems, spines not leaves, thick cuticle, shallow wide roots. <span class="key">Saguaro</span> = slowest-growing!</li>
<li><span class="key">Creosote bush</span> — toxic soil chemicals kill competition for water</li>
<li><span class="key">Mesquite</span> — taproots 30 m deep!</li>
<li>Small/no leaves to reduce water loss</li></ul>
<h4>Animal Adaptations</h4>
<ul><li><span class="key">Nocturnal</span> — active at night (kangaroo rats, scorpions)</li>
<li><span class="key">Burrowing</span> — underground cooler (prairie dogs)</li>
<li><span class="key">Large ears</span> — fennec fox radiates heat</li>
<li><span class="key">Kangaroo rats</span> — ALL water from food, never drink!</li>
<li>Light-coloured fur reflects sunlight</li></ul>`},

{t:"Desert Conservation & Threats",c:`<h4>Threats</h4>
<ul><li>Climate change → hotter, drier → more <span class="key">wildfires</span></li>
<li><span class="key">Livestock overgrazing</span> damages fragile soil</li>
<li>Off-road vehicles damage vegetation</li></ul>
<h4>Conservation</h4>
<ul><li><span class="key">Oasis</span> = place where underground water reaches surface</li>
<li>Use off-road vehicles on designated paths only</li>
<li>Limit livestock grazing</li>
<li>Protect water sources</li></ul>`},

{t:"Tropical Savannas",c:`<ul><li><span class="key">Warm year-round</span> (25-30°C)</li>
<li><span class="key">Wet + dry seasons</span> — 500-1500 mm/year</li>
<li>Dominated by <span class="key">grasses</span> with scattered trees</li>
<li>Between rainforests and deserts</li></ul>
<h4>Plants</h4>
<ul><li><span class="key">Grasses</span> — deep roots, regrow after fire</li>
<li><span class="key">Baobab</span> — stores <span class="key">120,000 L</span> water! Lives 5,000 years. "Tree of Life."</li>
<li><span class="key">Acacia</span> — umbrella canopy, thorns, <span class="key">warning chemicals</span> when eaten!</li>
<li><span class="key">Fire-adapted</span> — many NEED fire to germinate</li></ul>
<h4>Animals</h4>
<ul><li><span class="key">Migration</span> — 1.5M wildebeest, 800+ km following rain</li>
<li>Long legs (giraffes), camouflage (lions), herding (zebras)</li></ul>
<p><span class="key">Serengeti</span> (Tanzania/Kenya) = Great Migration.</p>`},

{t:"Tropical Rainforests: Characteristics",c:`<ul><li><span class="key">Warm + wet year-round</span> (25-28°C, 2000-10000 mm!)</li>
<li>~6% of Earth, <span class="key">>50% of species</span></li>
<li>"<span class="key">Lungs of Earth</span>" — massive O₂</li>
<li>Near equator</li></ul>
<h4>4 Layers</h4>
<ol><li><span class="key">Emergent</span> — 60-70 m. Eagles, butterflies.</li>
<li><span class="key">Canopy</span> — 30-45 m. <span class="key">MOST biodiversity!</span> Monkeys, toucans.</li>
<li><span class="key">Understory</span> — shade. Jaguars, snakes.</li>
<li><span class="key">Forest floor</span> — <span class="key"><2% sunlight</span>. Decomposers. Thin nutrient-poor soil!</li></ol>`},

{t:"Rainforest Adaptations & Threats",c:`<h4>Plant Adaptations</h4>
<ul><li><span class="key">Drip tips</span> — pointed leaves channel water off (prevents fungus)</li>
<li><span class="key">Buttress roots</span> — massive above-ground support in thin soil</li>
<li><span class="key">Epiphytes</span> — grow ON others for sunlight (orchids, ferns)</li>
<li><span class="key">Lianas</span> — woody vines to canopy</li></ul>
<h4>Threats</h4>
<p><span class="key">Deforestation</span> — <span class="key">18 million acres/year</span> for farming, logging, mining. Destroys habitats, contributes to climate change, reduces biodiversity.</p>`},

{t:"Boreal Forests (Taiga): Characteristics",c:`<ul><li>Cold winters (-40 to -20°C), cool summers (10-20°C)</li>
<li>250-500 mm precip (snow)</li>
<li><span class="key">Largest terrestrial biome</span> — Canada, Russia, Scandinavia</li>
<li>~<span class="key">30% of Earth's forests</span></li></ul>`},

{t:"Boreal Adaptations",c:`<h4>Plant</h4>
<ul><li><span class="key">Coniferous</span> (spruce, pine, fir) — needles = less water loss</li>
<li><span class="key">Cone shape</span> — snow slides off</li>
<li><span class="key">Evergreen</span> — photosynthesize immediately in spring</li>
<li><span class="key">Dark needles</span> — absorb more heat</li>
<li><span class="key">Thick bark</span> — insulation + fire protection</li></ul>
<h4>Animal</h4>
<ul><li><span class="key">Thick fur</span> — moose, wolves, lynx</li>
<li><span class="key">Hibernation</span> — bears</li>
<li><span class="key">Migration</span> — birds south</li>
<li><span class="key">Colour change</span> — snowshoe hare: white winter, brown summer</li>
<li><span class="key">Large feet</span> — hare/lynx = snowshoes</li></ul>
<h4>Canada's Boreal</h4>
<p>~270M hectares. <span class="key">208 billion tonnes carbon</span> = 26 years global fossil fuel emissions! Major <span class="key">carbon sink</span>.</p>`},

{t:"Arctic Tundra: Characteristics",c:`<ul><li><span class="key">Extremely cold</span> — winter -30 to -50°C, summer 3-12°C</li>
<li><250 mm precip (<span class="key">cold desert</span>!)</li>
<li><span class="key">Permafrost</span> — permanently frozen ground. Top 25-100 cm = <span class="key">active layer</span> (thaws summer)</li>
<li><span class="key">No trees</span> — too cold, windy, permafrost</li>
<li>Growing season: 50-60 days</li></ul>`},

{t:"Tundra Adaptations",c:`<h4>Plant</h4>
<ul><li><span class="key">Low-growing</span> — mosses, lichens, small shrubs (wind)</li>
<li><span class="key">Shallow roots</span> — can't penetrate permafrost</li>
<li><span class="key">Dark colours</span> — absorb heat</li>
<li><span class="key">Fuzzy stems</span> — trap warm air</li>
<li><span class="key">Rapid reproduction</span> — short summer</li></ul>
<h4>Animal</h4>
<ul><li><span class="key">Muskoxen</span> — 2 fur layers (soft inner + long outer)</li>
<li><span class="key">Blubber</span> — polar bears, walruses</li>
<li><span class="key">Caribou</span> — 5,000+ km/year (longest land migration!)</li>
<li><span class="key">Countercurrent heat exchange</span> — blood vessels warm cold blood coming in (prevents freezing feet!)</li>
<li><span class="key">Small extremities</span> — Arctic fox small ears (vs fennec fox large ears)</li></ul>`},

{t:"Climate Change & Permafrost",c:`<h4>Threats</h4>
<p>Arctic warms <span class="key">2-3× faster</span> than rest of Earth.</p>
<p>Permafrost thawing releases <span class="key">methane</span> (powerful greenhouse gas) → <span class="key">feedback loop</span>: more warming → more thawing → more methane → more warming.</p>
<h4>Impacts</h4>
<ul><li>Habitat loss for polar species</li>
<li>Buildings/roads collapse as ground thaws</li>
<li>Coastal erosion increases</li>
<li>Sea level rises from melting ice</li></ul>`},

{t:"Comparing All 5 Biomes",c:`<h4>Quick Comparison</h4>
<ul><li><span class="key">Hot Desert</span>: hot+dry, <250mm, cacti/scorpions</li>
<li><span class="key">Savanna</span>: warm, wet+dry seasons, grasses/baobabs/lions</li>
<li><span class="key">Rainforest</span>: hot+very wet, 4 layers, >50% species</li>
<li><span class="key">Boreal</span>: cold winters, conifers, 30% forests, carbon sink</li>
<li><span class="key">Tundra</span>: extreme cold, permafrost, no trees, cold desert</li></ul>
<p>KEY: All adaptations help organisms survive their specific temperature + precipitation conditions!</p>`},

{t:"Unit 1: Introduction to History",c:`<h4>Primary vs Secondary Sources</h4>
<ul><li><span class="key">Primary source</span> — created at the time of the event by someone who was there (diary, photo, speech, letter, artifact)</li>
<li><span class="key">Secondary source</span> — created after the event by someone analyzing/interpreting primary sources (textbook, documentary, biography)</li></ul>
<h4>Bias</h4>
<p>Every source has a <span class="key">perspective</span>. Identifying bias helps you understand <em>why</em> a source says what it says, who created it, and what they might leave out. No source is perfectly objective.</p>
<h4>Inference</h4>
<p>An <span class="key">inference</span> is a conclusion drawn from evidence + reasoning — reading between the lines of what a source doesn't explicitly say.</p>
<h4>OPCVL Method</h4>
<ul><li><span class="key">O</span>rigin — Who created it? When? Where?</li>
<li><span class="key">P</span>urpose — Why was it created? Who was the audience?</li>
<li><span class="key">C</span>ontent — What does it say? What information does it provide?</li>
<li><span class="key">V</span>alue — What makes this source useful? "A value of the origin of the source is…"</li>
<li><span class="key">L</span>imitation — What weaknesses does it have? "A possible limitation of the origin of the source is…"</li></ul>
<div class="note">Always identify O, P, or C <em>before</em> stating values/limitations. Use the correct academic language.</div>
<h4>The Big 6 Historical Thinking Concepts</h4>
<ol><li><span class="key">Historical Significance</span> — Why does this event matter? (resulted in change, affected many people, revealing, prominent at the time)</li>
<li><span class="key">Evidence</span> — How do we know what happened?</li>
<li><span class="key">Continuity & Change</span> — What stayed the same? What changed?</li>
<li><span class="key">Cause & Consequence</span> — What caused the event? What resulted from it?</li>
<li><span class="key">Historical Perspective</span> — Understanding people's decisions within the context of their time (don't judge the past by today's values)</li>
<li><span class="key">Ethical Dimension</span> — How do we make ethical judgments about the past?</li></ol>`},

{t:"Unit 2: Canada in World War One",c:`<h4>Long-Term Causes of WWI (M.A.I.N.)</h4>
<ul><li><span class="key">Militarism</span> — European powers built massive armies and navies, especially the Anglo-German naval arms race</li>
<li><span class="key">Alliances</span> — Two alliance systems: Triple Entente (Britain, France, Russia) vs Triple Alliance (Germany, Austria-Hungary, Italy). If one country was attacked, allies were pulled in</li>
<li><span class="key">Imperialism</span> — European nations competed for colonies, resources, and global power → tension and rivalry</li>
<li><span class="key">Nationalism</span> — Intense pride in one's nation/ethnic group. Some wanted independence (e.g. Slavic peoples in Austria-Hungary), others wanted dominance</li></ul>
<h4>Immediate Cause</h4>
<p>Assassination of <span class="key">Archduke Franz Ferdinand</span> of Austria-Hungary by Gavrilo Princip (Serbian nationalist) in Sarajevo, June 28, 1914. Austria-Hungary declared war on Serbia → alliance system triggered → all of Europe at war within weeks.</p>
<h4>Why Canada Went to War</h4>
<p>Canada was part of the <span class="key">British Empire</span>. When Britain declared war, Canada was automatically at war. However, Canada decided the size of its own contribution.</p>
<h4>Key Battles</h4>
<ul><li><span class="key">Ypres (1915)</span> — First major Canadian battle. Germans used <span class="key">chlorine gas</span> for the first time. Canadians held the line when French colonial troops retreated (used urine-soaked cloths as improvised gas masks)</li>
<li><span class="key">Somme (1916)</span> — Brutal, costly battle. Over 24,000 Canadian casualties. Tanks used for the first time</li>
<li><span class="key">Vimy Ridge (April 1917)</span> — All four Canadian divisions fought together for the first time. Used <span class="key">creeping barrage</span> tactics (artillery fire that moved forward just ahead of advancing troops). Considered a defining moment of Canadian national identity</li>
<li><span class="key">Passchendaele (1917)</span> — Fought in terrible mud. ~16,000 Canadian casualties for a gain of only a few kilometres</li></ul>
<h4>The Schlieffen Plan → Trench Warfare</h4>
<p>Germany's plan to avoid a <span class="key">two-front war</span>: quickly defeat France by sweeping through Belgium, then turn east to fight Russia. The plan failed — France didn't fall quickly, Russia mobilized faster than expected → <span class="key">stalemate</span> on the Western Front → both sides dug trenches → years of trench warfare.</p>
<h4>Women's Changing Roles</h4>
<ul><li>Worked in <span class="key">munitions factories</span>, farms, offices — jobs previously held by men</li>
<li>Served as <span class="key">nurses</span> near the front lines</li>
<li><span class="key">Suffragettes</span> gained momentum → women won the right to vote (Manitoba first in 1916, federally in 1918)</li></ul>
<h4>Conscription Crisis</h4>
<p>PM <span class="key">Robert Borden</span> passed the <span class="key">Military Service Act (1917)</span> — mandatory military service. <span class="key">English Canada</span> largely supported it (tied to Britain). <span class="key">French Canada</span> strongly opposed — they felt no loyalty to Britain or France and saw it as an English Canadian war. This created a deep national divide.</p>
<h4>Treaty of Versailles (1919)</h4>
<p>Signed at the <span class="key">Palace of Versailles</span>. Terms imposed on Germany:</p>
<ul><li><span class="key">War Guilt Clause</span> (Article 231) — Germany accepted full blame</li>
<li><span class="key">Reparations</span> — $33 billion in payments</li>
<li>Lost territory (Alsace-Lorraine to France, colonies taken)</li>
<li>Military restricted (100,000 soldiers, no air force, limited navy)</li>
<li>Led to <span class="key">hyperinflation</span> in Germany, economic devastation, resentment → contributed to rise of Hitler and WWII</li></ul>
<p><span class="key">Retribution vs Rehabilitation</span>: The treaty was punitive (retribution) rather than helping Germany recover (rehabilitation). Was it fair? Most historians say it was too harsh — it humiliated Germany without destroying its ability to eventually rearm.</p>
<h4>League of Nations</h4>
<p>Created after WWI to maintain peace. Proposed by Woodrow Wilson (US). Ultimately <span class="key">failed</span> — the US never joined, it had no army, couldn't enforce decisions.</p>
<div class="note">Key terms: <span class="key">Borden</span> (PM), <span class="key">Ferdinand</span> (assassination), <span class="key">Suffragettes</span>, <span class="key">Ypres</span>, <span class="key">No Man's Land</span> (area between trenches), <span class="key">Vimy Ridge</span>, <span class="key">U-Boat</span> (German submarine), <span class="key">Lusitania</span> (British ship sunk by U-Boat, 1,198 dead including 128 Americans), <span class="key">Zimmerman Telegram</span> (Germany asked Mexico to attack US → US entered war), <span class="key">Victory Bonds</span> (citizens lent money to gov't for war effort)</div>`},

{t:"Unit 3: Roaring 20s & Dirty 30s",c:`<h4>Who Didn't Experience the Prosperity of the 1920s?</h4>
<ul><li><span class="key">Black Canadians</span> — faced segregation, limited job opportunities, racism in housing and education</li>
<li><span class="key">Indigenous peoples</span> — <span class="key">Residential schools</span> forcibly removed children from families to "assimilate" them. The <span class="key">Indian Act</span> controlled every aspect of their lives</li>
<li><span class="key">Chinese immigrants</span> — <span class="key">Chinese Exclusion Act (1923)</span> banned Chinese immigration entirely. Those already in Canada faced discrimination and low-wage labour</li>
<li><span class="key">Jewish Canadians</span> — faced antisemitism, university quotas, restricted immigration ("none is too many" policy)</li></ul>
<h4>The Famous Five & The Persons Case</h4>
<p>Five women: <span class="key">Emily Murphy, Nellie McClung, Irene Parlby, Louise McKinney, Henrietta Muir Edwards</span></p>
<p>They challenged whether women were "persons" under the BNA Act (and therefore eligible for Senate appointment). Canada's Supreme Court said <em>no</em>. They appealed to Britain's Privy Council, which ruled in 1929: <span class="key">women ARE persons</span>. This became the <span class="key">Persons Case</span> — a landmark for women's rights in Canada.</p>
<h4>Group of Seven</h4>
<p>A group of <span class="key">Canadian landscape painters</span> (1920s) who painted the Canadian wilderness in a bold, distinctive style. They helped create a unique <span class="key">Canadian artistic identity</span> separate from European traditions.</p>
<h4>Women's Christian Temperance Movement & Prohibition</h4>
<p>The <span class="key">WCTM</span> campaigned against alcohol, linking it to domestic violence and poverty. This led to <span class="key">Prohibition</span> — laws banning the sale/production of alcohol. Ultimately failed due to bootlegging, organized crime, and lack of enforcement.</p>
<h4>Causes of the Great Depression</h4>
<p><span class="key">Long-term causes:</span></p>
<ul><li><span class="key">Overproduction</span> — factories produced more than people could buy</li>
<li><span class="key">Over-speculation</span> — people invested recklessly in the stock market</li>
<li><span class="key">Buying on margin</span> — borrowing money to buy stocks (when prices dropped, couldn't repay)</li>
<li><span class="key">Uneven wealth distribution</span> — the rich got richer, most people couldn't afford goods</li>
<li>Canada's <span class="key">dependence on exports</span> (wheat, fish, lumber) — when demand dropped, economy collapsed</li></ul>
<p><span class="key">Short-term cause:</span> <span class="key">Black Tuesday</span> — October 29, 1929. Stock market crashed. Banks failed. Unemployment skyrocketed. The Depression lasted through the 1930s.</p>`},

{t:"Unit 4: World War Two",c:`<h4>Why the League of Nations Failed</h4>
<ul><li>Had <span class="key">no army</span> to enforce decisions</li>
<li>The <span class="key">US never joined</span> (despite Wilson proposing it)</li>
<li>Couldn't stop aggression from Japan (Manchuria), Italy (Ethiopia), or Germany</li></ul>
<h4>Nazi-Soviet Non-Aggression Pact (Molotov-Ribbentrop Pact)</h4>
<p><span class="key">Hitler</span> wanted to avoid a two-front war (repeat of WWI). <span class="key">Stalin</span> wanted time to build his military. They agreed not to attack each other and secretly divided Poland. The editorial cartoon <span class="key">"Rendezvous"</span> depicted their unlikely partnership.</p>
<h4>Totalitarianism</h4>
<p>Characteristics: single party rule, censorship, propaganda, secret police, cult of personality, no opposition allowed.</p>
<ul><li><span class="key">Italy</span> — Benito Mussolini → <span class="key">Fascism</span></li>
<li><span class="key">Soviet Union</span> — Joseph Stalin → <span class="key">Communism</span></li>
<li><span class="key">Germany</span> — Adolf Hitler → <span class="key">Nazism</span> (National Socialism)</li></ul>
<h4>Hitler's Anti-Semitism</h4>
<p>Roots in his early life: failed art career in Vienna (blamed Jewish art dealers), exposure to antisemitic propaganda, WWI — embraced the <span class="key">"stab in the back" myth</span> (that Jews and communists caused Germany's defeat). Used Jews as scapegoats for all of Germany's problems.</p>
<h4>Lebensraum</h4>
<p><span class="key">"Living space"</span> — Hitler's goal to expand German territory eastward into Poland and the Soviet Union to provide land for the "Aryan race."</p>
<h4>Appeasement</h4>
<p>Policy of <span class="key">giving in to an aggressor's demands</span> to avoid war. Key steps:</p>
<ul><li><span class="key">Anschluss (1938)</span> — Germany annexed Austria</li>
<li><span class="key">Sudetenland (1938)</span> — Germany took the German-speaking part of Czechoslovakia</li>
<li><span class="key">Munich Agreement</span> — Britain & France agreed to let Hitler keep Sudetenland in exchange for promise of no more expansion. PM Chamberlain declared "peace for our time." Hitler broke the promise within months</li></ul>
<h4>Blitzkrieg</h4>
<p><span class="key">"Lightning war"</span> — fast, coordinated attacks using tanks (Panzer divisions), aircraft (Luftwaffe), and infantry to overwhelm enemies before they could respond. Used to conquer Poland in weeks.</p>
<h4>Axis vs Allied Powers</h4>
<ul><li><span class="key">Axis</span>: Germany, Italy, Japan</li>
<li><span class="key">Allies</span>: Britain, France, Canada, later Soviet Union (1941) and United States (1941)</li></ul>
<h4>Key Battles & Events</h4>
<ul><li><span class="key">Battle of Britain (1940)</span> — Air war. RAF vs Luftwaffe. Britain survived, Hitler abandoned invasion</li>
<li><span class="key">Dieppe Raid (1942)</span> — Canadian attack on occupied France. Disastrous failure — 907 Canadians killed, 1,946 captured. Lessons learned were applied to D-Day</li>
<li><span class="key">Battle of the Atlantic</span> — Ongoing naval war. U-Boats vs Allied convoys. Canada's navy played a major role in escorting supplies</li>
<li><span class="key">D-Day / Operation Overlord (June 6, 1944)</span> — Allies invaded Normandy, France. Canada landed at <span class="key">Juno Beach</span>. Turning point of the war in Europe</li></ul>
<h4>The Holocaust</h4>
<ul><li><span class="key">Final Solution</span> — Nazi plan for systematic extermination of Jews</li>
<li>Targets: Jews (~6 million killed), Roma, disabled, LGBTQ+, political opponents</li>
<li><span class="key">Stages of Isolation</span>: Identification (Star of David) → Exclusion (lost jobs, citizenship) → Concentration (ghettos, camps) → Extermination (death camps — Auschwitz, Treblinka, etc.)</li></ul>
<h4>Japanese Internment in Canada</h4>
<p>After <span class="key">Pearl Harbor (Dec 7, 1941)</span>, ~22,000 Japanese Canadians were forcibly relocated from the BC coast to internment camps. Property was seized and sold. Motivated by racism and wartime fear, not evidence of disloyalty. Canada apologized in 1988.</p>
<h4>Manhattan Project & Atomic Bombs</h4>
<p><span class="key">Manhattan Project</span> — secret US program to develop atomic weapons.</p>
<ul><li><span class="key">"Little Boy"</span> dropped on <span class="key">Hiroshima</span> — August 6, 1945</li>
<li><span class="key">"Fat Man"</span> dropped on <span class="key">Nagasaki</span> — August 9, 1945</li>
<li>Connected to Pearl Harbor — Japan's attack brought US into the war; atomic bombs ended it</li>
<li>Japan surrendered August 15, 1945 (V-J Day)</li></ul>
<h4>WWI vs WWII: Continuity & Change</h4>
<ul><li><span class="key">Continuity</span>: Canada fought alongside Britain, total war effort, women took on new roles, propaganda used</li>
<li><span class="key">Change</span>: Canada declared war independently (1939 — one week after Britain), more technological warfare (tanks, planes, atomic weapons), Holocaust showed new scale of atrocity, Canada emerged as middle power</li></ul>`},

{t:"Unit 5: 1950s to Present",c:`<h4>The Cold War</h4>
<p>A <span class="key">cold war</span> is a state of political/military tension between powers <em>without</em> direct military conflict. The Cold War (1947–1991) was between the <span class="key">USA (capitalism/democracy)</span> and <span class="key">USSR (communism)</span>.</p>
<h4>The United Nations</h4>
<p>Established <span class="key">1945</span>, replaced the failed League of Nations. Goals: maintain peace, protect human rights, promote cooperation. Canadian <span class="key">John Humphrey</span> drafted the initial version of the <span class="key">UN Declaration of Human Rights (1948)</span>.</p>
<h4>Mutually Assured Destruction (MAD)</h4>
<p>Both the US and USSR had enough <span class="key">nuclear weapons</span> to completely destroy each other. This paradoxically <em>prevented</em> direct war — launching first meant guaranteed self-destruction.</p>
<h4>NATO vs Warsaw Pact</h4>
<ul><li><span class="key">NATO (1949)</span> — North Atlantic Treaty Organization. Western military alliance (US, Canada, Western Europe)</li>
<li><span class="key">Warsaw Pact (1955)</span> — Soviet military alliance (USSR + Eastern European satellite states)</li>
<li>Both led to an <span class="key">arms race</span> — each side built more weapons to match the other</li></ul>
<h4>The Arctic (1950s–Present)</h4>
<p><span class="key">DEW Line</span> (Distant Early Warning) — radar stations across Arctic Canada during Cold War to detect Soviet bombers. Today: <span class="key">Northwest Passage</span> sovereignty disputes (Canada says internal waters, others say international strait), resource claims as ice melts.</p>
<h4>Korean War (1950–1953)</h4>
<p>North Korea (communist, backed by China/USSR) invaded South Korea. Canada sent troops as part of a <span class="key">UN force</span>. War ended in stalemate — Korea divided at the <span class="key">38th parallel</span> (still today). ~26,000 Canadians served.</p>
<h4>Peacekeeping</h4>
<ul><li><span class="key">Suez Crisis (1956)</span> — Egypt nationalized the Suez Canal. Britain, France, Israel invaded. <span class="key">Lester B. Pearson</span> proposed a <span class="key">UN Emergency Force</span> to separate the combatants — the first modern peacekeeping mission. He won the <span class="key">Nobel Peace Prize</span> for it</li>
<li><span class="key">Rwanda (1994)</span> — Genocide of Tutsis by Hutus. ~800,000 killed in 100 days. Canadian General <span class="key">Roméo Dallaire</span> commanded the small UN force. Begged for reinforcements but the UN and world powers <span class="key">failed to intervene</span>. A devastating failure of international peacekeeping</li></ul>
<h4>Canadian Charter of Rights and Freedoms (1982)</h4>
<p>Part of the <span class="key">Constitution Act, 1982</span>. Guarantees fundamental freedoms (expression, religion, assembly), democratic rights, mobility rights, legal rights, equality rights. Applies to all levels of government.</p>
<h4>French-English Relations</h4>
<ul><li><span class="key">October Crisis (1970)</span> — FLQ (Front de libération du Québec) kidnapped British diplomat James Cross and Quebec minister Pierre Laporte (murdered). PM Trudeau invoked the <span class="key">War Measures Act</span> — suspended civil liberties, army deployed in Quebec</li>
<li><span class="key">1980 Referendum</span> — Quebec voted to stay in Canada (~60% No)</li>
<li><span class="key">1995 Referendum</span> — Extremely close: 50.6% No, 49.4% Yes. Quebec nearly separated</li>
<li><span class="key">Bill 21</span> — Quebec secularism law banning religious symbols for public workers (teachers, police, judges). Controversial — seen as targeting Muslim women wearing hijab</li></ul>
<h4>Indigenous-Canadian Relations</h4>
<ul><li><span class="key">Residential Schools</span> — Government-funded, church-run schools that forcibly removed Indigenous children from families (1880s–1996). Aimed to "kill the Indian in the child." Physical, emotional, sexual abuse widespread</li>
<li><span class="key">Truth and Reconciliation Commission (TRC)</span> — Investigated residential schools, published 94 Calls to Action for reconciliation</li>
<li><span class="key">Oka Crisis (1990)</span> — Mohawk land dispute in Quebec. Town wanted to expand a golf course onto Indigenous burial ground. Armed standoff lasted 78 days. Highlighted ongoing Indigenous land rights issues</li>
<li><span class="key">Inuit Arctic Relocation (1950s)</span> — Canadian government forcibly relocated Inuit families to the High Arctic to assert sovereignty. Families faced starvation and extreme conditions. Government apologized in 2010</li></ul>
<h4>War in Afghanistan (2001–2014)</h4>
<p>After <span class="key">9/11 attacks</span>, Canada joined the US-led invasion of Afghanistan (targeting Taliban and al-Qaeda). Canada's combat role focused on <span class="key">Kandahar province</span>. <span class="key">158 Canadian soldiers</span> were killed. Canada's largest combat mission since Korea.</p>`},

{t:"Big Themes (Long Answer Prep)",c:`<h4>Theme 1: Comparing WWI / WWII / Cold War</h4>
<ul><li><span class="key">WWI</span>: Canada entered automatically (British Empire). Trench warfare. Emerged with growing national identity (Vimy Ridge). Conscription crisis divided the nation</li>
<li><span class="key">WWII</span>: Canada declared war independently (1 week after Britain). More technological. Canada played key roles (Juno Beach, Battle of Atlantic). Emerged as a <span class="key">middle power</span></li>
<li><span class="key">Cold War</span>: No direct combat with superpowers. Canada's role shifted to <span class="key">peacekeeping</span> (Suez, Korea, Rwanda). NATO member. Balanced relationship between US and independence</li>
<li><span class="key">Evolution</span>: Colonial obligation → independent decision → peacekeeping/diplomacy</li></ul>
<h4>Theme 2: History of Reconciliation</h4>
<ul><li>1920s prosperity excluded Indigenous peoples, Black Canadians, Chinese and Jewish Canadians</li>
<li>WWI: Conscription forced on unwilling populations</li>
<li>WWII: Japanese internment, antisemitism ("none is too many"), Indigenous soldiers returned to discrimination</li>
<li>Residential schools (1880s–1996) → TRC, 94 Calls to Action</li>
<li>Ongoing: Oka Crisis, missing and murdered Indigenous women, land claims, clean water access</li>
<li>Pattern: Injustice → delayed acknowledgment → formal apology → ongoing work toward reconciliation</li></ul>
<h4>Theme 3: Canada's Role in International Conflicts Since WWI</h4>
<ul><li>WWI → established military credibility (Vimy Ridge)</li>
<li>WWII → independent player, Juno Beach, Battle of Atlantic</li>
<li>Korean War → UN commitment</li>
<li>Suez Crisis → invented modern peacekeeping (Pearson)</li>
<li>Rwanda → failure of international community</li>
<li>Afghanistan → combat role post-9/11</li>
<li>Canada's identity shifted from <span class="key">warrior nation to peacekeeper</span>, though Afghanistan complicated that narrative</li></ul>
<div class="note">For long answer questions: always tie your analysis back to these themes. Use specific examples with dates. Show continuity AND change across time periods.</div>`}

function renderQ(i){

else if(q.t==='ord'){h+=`<div class="ord-opts" id="ord${i}">`;const sh=[...q.ord];for(let k=sh.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[sh[k],sh[j]]=[sh[j],sh[k]]}sh.forEach((item,j)=>{h+=`<div class="ord-opt" draggable="true" data-val="${item}" data-idx="${j}">${j+1}. ${item}</div>`});h+=`</div><button class="ord-check" onclick="checkOrd(${i})">Check Order</button><div class="ord-res" id="ordres${i}"></div>`}

}
function startTimer(qi){if(timerInterval)clearInterval(timerInterval);let rem=timerSec*10;const tot=timerSec*10;timerInterval=setInterval(()=>{rem--;const pct=(rem/tot)*100;const fill=document.getElementById('timer-fill-'+qi);const txt=document.getElementById('timer-txt-'+qi);if(fill){fill.style.width=pct+'%';fill.className='timer-fill'+(pct<25?' danger':pct<50?' warn':'')}if(txt)txt.textContent=Math.ceil(rem/10)+'s';if(rem<=0){clearInterval(timerInterval);timerInterval=null;const q=qList[qi];if(q.t==='mc'||q.t==='tf'){const btns=document.querySelectorAll(`[data-q="${qi}"]`);if(!btns[0].classList.contains('dis')){btns.forEach(b=>{b.classList.add('dis');if(parseInt(b.dataset.o)===q.a)b.classList.add('cor')});streak=0;updateStreakBar();setTimeout(()=>{qIdx++;renderQ(qIdx)},1200)}}else if(q.t==='ord'){const btn=document.querySelector(`#qq${qi} .ord-check`);if(!btn.disabled)checkOrd(qi)}}},100)}
function updateStreakBar(){const el=document.getElementById('streak-txt');if(streak>=3)el.innerHTML='🔥 '+streak+' streak!';else el.textContent='🔥 '+streak+' streak';if(streak>bestStreak)bestStreak=streak;if(streak>=3)el.classList.add('fire');else el.classList.remove('fire');document.getElementById('score-live').textContent=qScore+'/'+Math.min(qIdx+1,qTotal)}
function pickOpt(qi,oi,btn){const q=qList[qi];const btns=document.querySelectorAll(`[data-q="${qi}"]`);if(btns[0].classList.contains('dis'))return;if(timerInterval){clearInterval(timerInterval);timerInterval=null}btns.forEach(b=>{b.classList.add('dis');if(parseInt(b.dataset.o)===q.a)b.classList.add('cor')});if(oi!==q.a){btn.classList.add('wrg');streak=0}else{qScore++;streak++;checkBonusQuest('streak',streak)}updateStreakBar();setTimeout(()=>{qIdx++;renderQ(qIdx)},1000)}
function checkOrd(qi){const q=qList[qi];const container=document.getElementById('ord'+qi);const current=[...container.querySelectorAll('.ord-opt')].map(el=>el.dataset.val);const correct=q.ord;const res=document.getElementById('ordres'+qi);const btn=container.nextElementSibling;btn.disabled=true;if(timerInterval){clearInterval(timerInterval);timerInterval=null}if(JSON.stringify(current)===JSON.stringify(correct)){res.className='ord-res cor';res.textContent='✅ Correct!';qScore++;streak++}else{res.className='ord-res wrg';res.textContent='❌ Correct: '+correct.join(' → ');streak=0}updateStreakBar();setTimeout(()=>{qIdx++;renderQ(qIdx)},1200)}

function setupDragDrop(){document.querySelectorAll('.ord-opts').forEach(container=>{let dragEl=null;container.addEventListener('dragstart',e=>{dragEl=e.target;e.target.classList.add('dragging');e.dataTransfer.effectAllowed='move'});container.addEventListener('dragend',e=>{e.target.classList.remove('dragging');dragEl=null});container.addEventListener('dragover',e=>{e.preventDefault();const after=getDragAfterElement(container,e.clientY);if(after==null)container.appendChild(dragEl);else container.insertBefore(dragEl,after);updateOrdNumbers(container)});let touchEl=null;container.addEventListener('touchstart',e=>{const t=e.target.closest('.ord-opt');if(!t)return;touchEl=t;touchEl.classList.add('dragging')},{passive:true});container.addEventListener('touchmove',e=>{if(!touchEl)return;e.preventDefault();const touch=e.touches[0];const after=getDragAfterElement(container,touch.clientY);if(after==null)container.appendChild(touchEl);else container.insertBefore(touchEl,after);updateOrdNumbers(container)},{passive:false});container.addEventListener('touchend',e=>{if(touchEl){touchEl.classList.remove('dragging');touchEl=null}})})}
function getDragAfterElement(c,y){const els=[...c.querySelectorAll('.ord-opt:not(.dragging)')];return els.reduce((cl,child)=>{const box=child.getBoundingClientRect();const off=y-box.top-box.height/2;if(off<0&&off>cl.offset)return{offset:off,element:child};return cl},{offset:Number.NEGATIVE_INFINITY}).element}
function updateOrdNumbers(c){[...c.querySelectorAll('.ord-opt')].forEach((el,i)=>{el.textContent=`${i+1}. ${el.dataset.val}`})}

// === HINT USAGE ===
function useHint(qi){
const hints=getHints();if(hints<=0)return;
const q=qList[qi];if(q.t!=='mc')return;
const btns=document.querySelectorAll(`[data-q="${qi}"]`);
if(btns[0].classList.contains('dis'))return;
// Find a wrong answer that isn't already hidden and hide it
const wrongIdxs=[];
btns.forEach((b,j)=>{if(parseInt(b.dataset.o)!==q.a&&!b.classList.contains('hint-hide'))wrongIdxs.push(j)});
if(wrongIdxs.length<=1)return; // Don't remove if only 1 wrong left
const hideIdx=wrongIdxs[Math.floor(Math.random()*wrongIdxs.length)];
btns[hideIdx].classList.add('hint-hide');btns[hideIdx].style.opacity='0.2';btns[hideIdx].style.pointerEvents='none';
setHints(hints-1);
const hintBtn=document.getElementById('hint-btn-'+qi);
if(hintBtn){if(getHints()>0)hintBtn.textContent='🔮 Use Hint ('+getHints()+' left)';else hintBtn.remove()}
}

function playROB(pick){
const r=getROBToday();
if(r.plays>=2&&!r.extraBought){alert('No plays left! Buy unlock for 20🪙');return}
const betInput=document.getElementById('rob-bet');
const bet=parseInt(betInput.value);
if(isNaN(bet)||bet<1||bet>getCoins()){alert('Invalid bet!');return}
r.plays++;saveROB(r);
const result=Math.random()<0.5?'red':'black';
const won=pick===result;
const resEl=document.getElementById('gamble-result');
if(won){
addCoins(bet);
resEl.innerHTML=`<div class="gamble-result" style="border-color:${result==='red'?'#ff4444':'#555'}"><div class="gamble-emoji">${result==='red'?'🔴':'⚫'}</div><h3 style="color:#00ffa3">You WIN! +${bet} 🪙</h3><p style="color:#888;margin-top:8px">Balance: ${getCoins()} 🪙</p><button onclick="renderShop()" style="margin-top:10px;padding:6px 14px;border:none;border-radius:8px;background:#00ffa3;color:#0a0a1a;font-weight:bold;cursor:pointer">Nice!</button></div>`;
}else{
addCoins(-bet);
resEl.innerHTML=`<div class="gamble-result" style="border-color:${result==='red'?'#ff4444':'#555'}"><div class="gamble-emoji">${result==='red'?'🔴':'⚫'}</div><h3 style="color:#ff4444">You LOSE! -${bet} 🪙</h3><p style="color:#888;margin-top:8px">Balance: ${getCoins()} 🪙</p><button onclick="renderShop()" style="margin-top:10px;padding:6px 14px;border:none;border-radius:8px;background:#ff4444;color:#fff;font-weight:bold;cursor:pointer">Ouch...</button></div>`;
}
updateCoinDisplay()
}

// === HEAT QUIZ ===
let heatList=[],heatIdx=0,heatScore=0,heatTotal=30;
function startHeatQuiz(){
if(getCoins()<23)return;
const heat=getHeatToday();
if(heat.played){alert('Already played today!');return}
addCoins(-23);
// Gather 30 random MC/TF from ALL chapters
let pool=[];
Object.keys(CH).forEach(k=>{Object.values(CH[k].quizzes).forEach(arr=>pool.push(...arr.filter(q=>q.t==='mc'||q.t==='tf')))});
for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
pool=pool.slice(0,30).map(q=>{if(q.t==='mc'){const opts=q.o.map((o,i)=>({text:o,orig:i}));for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}const newA=opts.findIndex(o=>o.orig===q.a);return{...q,o:opts.map(o=>o.text),a:newA}}return q});
heatList=pool;heatIdx=0;heatScore=0;heatTotal=pool.length;
// Use quiz section
showSec('quiz');
document.getElementById('qsetup').style.display='none';
document.getElementById('qarea').style.display='block';
document.getElementById('qres').style.display='none';
document.getElementById('streak-bar').style.display='flex';
streak=0;bestStreak=0;qScore=0;qTotal=heatTotal;qIdx=0;qList=heatList;qDone=false;
window._heatMode=true;
quizChapter='heat';
updateStreakBar();renderQ(0)
}

// Patch finishQuiz for heat mode
const _origFinishQuiz=finishQuiz;
finishQuiz=function(){
if(window._heatMode&&!isGuest&&currentUser){
window._heatMode=false;
if(timerInterval){clearInterval(timerInterval);timerInterval=null}
qDone=true;
const earned=qScore; // 1 coin per correct
addCoins(earned);
// Mark heat as played
const heat=getHeatToday();heat.played=true;
localStorage.setItem('sh_heat_'+currentUser.id,JSON.stringify(heat));
saveHistory({time:Date.now(),chapter:'heat',type:'Heat Quiz',score:qScore,total:qTotal});
document.getElementById('qarea').style.display='none';document.getElementById('streak-bar').style.display='none';
const pct=Math.round(qScore/qTotal*100);const cls=pct>=80?'g':pct>=60?'o':'b';
const el=document.getElementById('qres');el.style.display='block';
el.innerHTML=`<div class="qres"><h2>🔥 Heat Quiz Complete!</h2><div class="sc ${cls}">${pct}%</div><p>${qScore}/${qTotal} correct</p><p style="color:#ffd700;font-size:1.2em;margin:10px 0">+${earned} 🪙 earned!</p><p style="color:#888;font-size:.85em">Cost 23, earned ${earned} → net ${earned>=23?'+':''}${earned-23} 🪙</p><p style="color:#ffd700;margin:8px 0">🔥 Best streak: ${bestStreak}</p><button onclick="showSec('shop')">🪙 Shop</button><button onclick="showSec('dash')">📊 Dashboard</button></div>`;
el.scrollIntoView({behavior:'smooth'});
updateCoinDisplay();
}else{
_origFinishQuiz();
}
}

// === AI SEARCH ===
function renderAI(){
const el=document.getElementById('ai-chat');
const suggestions=['What is permafrost?','How does photosynthesis work?','Explain Snell\'s Law','What is blockchain?','Moon phases','Biome types','4-stroke engine','Euler path'];
let h=`<div class="ai-container"><div class="ai-search-wrap"><input class="ai-search" id="ai-input" placeholder="Ask me anything about your 8 chapters..." onkeydown="if(event.key==='Enter')aiSearch()"><button class="ai-search-btn" onclick="aiSearch()">🔍</button></div><div id="ai-results"><div class="ai-welcome"><h2>👍😎 Mate Buddy</h2><p>Search across all 104 topics and 279 flashcards instantly.</p><p style="font-size:.8em">Try one of these:</p><div class="ai-suggestions">`;
suggestions.forEach(s=>{h+=`<button onclick="document.getElementById('ai-input').value='${s}';aiSearch()">${s}</button>`});
h+=`</div></div></div></div>`;el.innerHTML=h;document.getElementById('ai-input').focus()
}
function aiSearch(){
const query=document.getElementById('ai-input').value.trim().toLowerCase();if(!query)return;
bonusTracking.aiSearches++;checkBonusQuest('aisearch');
const words=query.split(/\s+/).filter(w=>w.length>1);
const stop=new Set(['the','is','a','an','what','how','does','do','why','are','was','were','can','could','would','should','of','in','on','at','to','for','and','or','it','its','this','that','with','from','by','be','been','has','have','had']);
const kw=words.filter(w=>!stop.has(w));if(!kw.length&&words.length)kw.push(...words);
let results=[];
Object.keys(CH).forEach(chKey=>{const ch=CH[chKey];
ch.topics.forEach(tp=>{const text=(tp.t+' '+tp.c).toLowerCase();let score=0;kw.forEach(k=>{if(tp.t.toLowerCase().includes(k))score+=10;score+=(text.match(new RegExp(k,'g'))||[]).length*2});if(score>0)results.push({type:'topic',chKey,chName:ch.name,title:tp.t,content:tp.c,score})});
ch.cards.forEach(card=>{const text=(card.q+' '+card.a).toLowerCase();let score=0;kw.forEach(k=>{if(card.q.toLowerCase().includes(k))score+=8;if(card.a.toLowerCase().includes(k))score+=5});if(score>0)results.push({type:'card',chKey,chName:ch.name,q:card.q,a:card.a,score})});
});
results.sort((a,b)=>b.score-a.score);const el=document.getElementById('ai-results');
if(!results.length){el.innerHTML=`<div class="ai-no-results"><h3>No results</h3><p>Try different keywords</p></div>`;return}
const topicRes=results.filter(r=>r.type==='topic').slice(0,8);const cardRes=results.filter(r=>r.type==='card').slice(0,5);
let h='';
if(cardRes.length){h+=`<div style="margin-bottom:10px;color:#ffd700;font-size:.85em;font-weight:bold">⚡ Quick Answers</div>`;cardRes.forEach(r=>{h+=`<div class="ai-card-match"><div class="ai-card-q">Q: ${r.q}</div><div class="ai-card-a">A: ${r.a}</div><div style="color:#555;font-size:.72em;margin-top:4px">${r.chName}</div></div>`})}
if(topicRes.length){h+=`<div style="margin:15px 0 10px;color:#00ffa3;font-size:.85em;font-weight:bold">📖 Topics (${topicRes.length})</div>`;topicRes.forEach(r=>{let sn=r.content.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();if(sn.length>300)sn=sn.substring(0,300)+'...';kw.forEach(k=>{sn=sn.replace(new RegExp('('+k+')','gi'),'<b style="color:#00ffa3">$1</b>')});h+=`<div class="ai-result" onclick="curCh='${r.chKey}';buildChBar();showSec('booklet')"><h4>${r.title}</h4><div class="ai-chapter">${r.chName}</div><div class="ai-snippet">${sn}</div></div>`})}
el.innerHTML=h
}

// === INIT ===
buildChBar();render()
</script>
