<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Hub - Complete Science Review</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a1a;color:#e0e0e0;min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#444;border-radius:3px}
.topbar{background:#0f0f2a;padding:8px 15px;display:flex;align-items:center;gap:10px;border-bottom:2px solid #1a1a3a;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.topbar h1{color:#00ffa3;font-size:1.1em;margin-right:10px;white-space:nowrap}
.tabs{display:flex;gap:5px;flex-wrap:wrap}.tabs button{padding:6px 14px;border:none;border-radius:15px;cursor:pointer;font-size:.85em;background:#1a1a3a;color:#888;transition:.3s}
.tabs button.active{background:#00ffa3;color:#0a0a1a;font-weight:bold}.tabs button:hover{background:#252550;color:#ccc}.tabs button.active:hover{background:#00dd8a}
.user-badge{margin-left:auto;padding:4px 12px;border-radius:12px;background:#1a1a3a;color:#ffd700;font-size:.8em;cursor:pointer;border:1px solid #3a3a5a}
.user-badge:hover{background:#252550}
.ch-bar{display:flex;gap:4px;padding:5px 15px;background:#0d0d22;overflow-x:auto;border-bottom:1px solid #1a1a3a}
.ch-bar button{padding:5px 10px;border:1px solid #2a2a4a;border-radius:10px;background:transparent;color:#777;cursor:pointer;font-size:.78em;white-space:nowrap;transition:.3s}
.ch-bar button.active{border-color:#00ffa3;color:#00ffa3;background:#0a2a1a}
.ch-bar button.main-ch{border-color:#ffd700;color:#ffd700;background:#2a2a0a}
.ch-bar button.main-ch.active{border-color:#ffd700;color:#0a0a1a;background:#ffd700}
.container{max-width:920px;margin:0 auto;padding:15px}
.section{display:none}.section.active{display:block}
.topic{background:#12122a;border-radius:10px;margin-bottom:8px;border:1px solid #1e1e3a;overflow:hidden}
.topic-h{padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.topic-h:hover{background:#181840}.topic-h h3{color:#00ffa3;font-size:.93em}.topic-h .arr{color:#00ffa3;transition:.3s}.topic-h .arr.open{transform:rotate(90deg)}
.topic-b{padding:0 16px 16px;display:none;line-height:1.65;font-size:.88em}.topic-b.open{display:block}
.topic-b p{margin-bottom:8px}.key{color:#ffd700;font-weight:bold}
.formula{background:#1a1a3a;padding:6px 12px;border-radius:6px;font-family:monospace;color:#00ffa3;margin:6px 0;display:inline-block}
.topic-b ul,.topic-b ol{padding-left:18px;margin-bottom:8px}.topic-b li{margin-bottom:3px}.topic-b h4{color:#64b5f6;margin:10px 0 5px}
.fc{display:flex;flex-direction:column;align-items:center}
.fc-ctrl{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap;width:100%}
.fc-ctrl button{padding:6px 14px;border:none;border-radius:8px;cursor:pointer;background:#1a1a3a;color:#00ffa3;font-size:.85em}
.fc-ctrl button:hover{background:#252550}.fc-cnt{color:#888;font-size:.85em;margin-left:auto}
.fc-wrap{perspective:1000px;width:100%;max-width:480px;height:250px;cursor:pointer;margin-bottom:12px}
.fc-card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.5s}
.fc-card.flip{transform:rotateY(180deg)}
.fc-card .fr,.fc-card .bk{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:25px;text-align:center;font-size:1em;line-height:1.5}
.fc-card .fr{background:linear-gradient(135deg,#151540,#252560);border:2px solid #3a3a6a;color:#fff}
.fc-card .bk{background:linear-gradient(135deg,#0a2a1a,#153520);border:2px solid #00ffa3;color:#00ffa3;transform:rotateY(180deg)}
.fc-nav{display:flex;gap:15px}.fc-nav button{padding:8px 25px;border:none;border-radius:8px;cursor:pointer;background:#1a1a3a;color:#00ffa3;font-size:.9em}.fc-nav button:hover{background:#252550}
.fc-label{color:#555;font-size:.8em;margin-bottom:8px}
.qsetup{text-align:center;padding:30px 15px}.qsetup h2{color:#00ffa3;margin-bottom:15px;font-size:1.2em}
.qtopics{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:20px}
.qtopics button{padding:8px 14px;border:1px solid #3a3a5a;border-radius:8px;background:transparent;color:#aaa;cursor:pointer;font-size:.83em;transition:.3s}
.qtopics button.sel{border-color:#00ffa3;color:#00ffa3;background:#0a2a1a}
.qstart{padding:10px 30px;border:none;border-radius:10px;background:#00ffa3;color:#0a0a1a;font-size:1em;font-weight:bold;cursor:pointer;margin:5px}
.qstart:disabled{background:#333;color:#555;cursor:not-allowed}.qstart:hover:not(:disabled){background:#00dd8a}
.qq{background:#12122a;border-radius:10px;padding:18px;margin-bottom:10px;border:1px solid #1e1e3a;position:relative}
.qq h3{margin-bottom:12px;color:#fff;font-size:.93em;line-height:1.4}.qq .qn{color:#00ffa3;font-size:.78em;margin-bottom:5px}
.qq .qtag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7em;margin-bottom:8px}
.qq .qtag.mc{background:#1a1a4a;color:#64b5f6}.qq .qtag.tf{background:#2a1a1a;color:#ff8a65}.qq .qtag.ord{background:#1a2a1a;color:#81c784}.qq .qtag.fib{background:#2a2a1a;color:#ffd700}
.opt{display:block;width:100%;padding:10px 14px;margin-bottom:6px;border:2px solid #2a2a4a;border-radius:8px;background:#0f0f25;color:#ccc;cursor:pointer;text-align:left;font-size:.88em;transition:.2s}
.opt:hover:not(.dis){border-color:#64b5f6;background:#151540}.opt.cor{border-color:#00ffa3!important;background:#0a2a1a!important;color:#00ffa3!important}
.opt.wrg{border-color:#ff4444!important;background:#2a0a0a!important;color:#ff4444!important}.opt.dis{cursor:default;opacity:.7}
.ord-opts{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.ord-opt{padding:8px 12px;border:2px solid #2a2a4a;border-radius:8px;background:#0f0f25;color:#ccc;cursor:grab;font-size:.88em;user-select:none;transition:.2s;touch-action:none}
.ord-opt:hover{border-color:#64b5f6}.ord-opt.dragging{opacity:.5}
.ord-check{padding:8px 20px;border:none;border-radius:8px;background:#00ffa3;color:#0a0a1a;cursor:pointer;font-weight:bold;font-size:.88em}
.ord-check:hover{background:#00dd8a}.ord-check:disabled{background:#333;color:#555;cursor:not-allowed}
.ord-res{margin-top:8px;font-size:.88em;font-weight:bold}.ord-res.cor{color:#00ffa3}.ord-res.wrg{color:#ff4444}
.qres{text-align:center;padding:30px;background:#12122a;border-radius:14px;border:1px solid #1e1e3a}
.qres h2{color:#00ffa3;font-size:1.5em;margin-bottom:8px}.qres .sc{font-size:2.5em;font-weight:bold;margin:15px 0}
.qres .sc.g{color:#00ffa3}.qres .sc.o{color:#ffd700}.qres .sc.b{color:#ff4444}
.qres button{padding:10px 20px;border:none;border-radius:8px;background:#00ffa3;color:#0a0a1a;font-weight:bold;cursor:pointer;margin:3px}.qres button:hover{background:#00dd8a}
.ai-badge{display:inline-block;padding:3px 10px;border-radius:12px;background:linear-gradient(90deg,#6a11cb,#2575fc);color:#fff;font-size:.75em;font-weight:bold;margin-bottom:10px}
.q-count-sel,.q-mode-sel{display:flex;gap:8px;justify-content:center;margin-bottom:15px;align-items:center}
.q-count-sel label,.q-mode-sel label{color:#aaa;font-size:.88em}
.q-count-sel select,.q-mode-sel select{padding:4px 8px;border-radius:6px;background:#1a1a3a;color:#00ffa3;border:1px solid #3a3a5a;font-size:.88em}
.note{background:#1a1a3a;padding:10px 14px;border-radius:8px;border-left:3px solid #00ffa3;margin:8px 0;font-size:.88em}
.warn{background:#2a1a1a;border-left-color:#ff8a65}
/* TIMER */
.timer-bar{height:4px;background:#1a1a3a;border-radius:2px;margin-bottom:10px;overflow:hidden}
.timer-fill{height:100%;background:#00ffa3;transition:width .1s linear;border-radius:2px}
.timer-fill.warn{background:#ffd700}.timer-fill.danger{background:#ff4444}
.timer-txt{font-size:.78em;color:#888;text-align:right;margin-bottom:4px}
/* STREAK */
.streak-bar{position:sticky;top:52px;z-index:99;background:#0d0d22;padding:6px 15px;border-bottom:1px solid #1a1a3a;display:flex;justify-content:space-between;align-items:center;font-size:.85em}
.streak-bar .streak{color:#ffd700;font-weight:bold}.streak-bar .streak.fire{animation:pulse .4s}
.streak-bar .score-live{color:#00ffa3}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
/* FIB */
.fib-input{width:100%;padding:10px 14px;border:2px solid #2a2a4a;border-radius:8px;background:#0f0f25;color:#fff;font-size:.88em;margin-bottom:6px}
.fib-input:focus{border-color:#64b5f6;outline:none}
.fib-check{padding:8px 20px;border:none;border-radius:8px;background:#00ffa3;color:#0a0a1a;cursor:pointer;font-weight:bold;font-size:.88em}
.fib-check:hover{background:#00dd8a}
.fib-res{margin-top:8px;font-size:.88em;font-weight:bold}.fib-res.cor{color:#00ffa3}.fib-res.wrg{color:#ff4444}
/* MULTI */
.mp-setup{text-align:center;padding:30px 15px}
.mp-setup h2{color:#ff6b6b;margin-bottom:10px}
.mp-setup h3{color:#00ffa3;margin:15px 0 8px}
.mp-players{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:15px}
.mp-players input{padding:8px 14px;border:2px solid #3a3a5a;border-radius:8px;background:#0f0f25;color:#fff;font-size:.88em;width:160px;text-align:center}
.mp-players input:focus{border-color:#ff6b6b;outline:none}
.mp-turn{text-align:center;padding:10px;background:#1a1a3a;border-radius:10px;margin-bottom:15px}
.mp-turn .player-name{color:#ff6b6b;font-size:1.3em;font-weight:bold}
.mp-scoreboard{background:#12122a;border-radius:14px;padding:20px;border:1px solid #1e1e3a;margin-bottom:15px}
.mp-scoreboard h2{color:#ff6b6b;text-align:center;margin-bottom:15px}
.mp-scoreboard table{width:100%;border-collapse:collapse}
.mp-scoreboard th{color:#00ffa3;padding:8px;text-align:left;border-bottom:2px solid #2a2a4a}
.mp-scoreboard td{padding:8px;border-bottom:1px solid #1a1a3a}
.mp-scoreboard tr.winner{background:#0a2a1a}
.mp-ready{padding:30px;text-align:center;background:#12122a;border-radius:14px;border:1px solid #1e1e3a}
.mp-ready h2{color:#ff6b6b;margin-bottom:8px}
.mp-ready .player-name{color:#ff6b6b;font-size:1.8em;font-weight:bold;margin:15px 0}
/* AI CHAT */
.ai-container{max-width:700px;margin:0 auto}
.ai-search-wrap{position:relative;margin-bottom:15px}
.ai-search{width:100%;padding:14px 50px 14px 16px;border:2px solid #2a2a4a;border-radius:12px;background:#0f0f25;color:#fff;font-size:1em}
.ai-search:focus{border-color:#00ffa3;outline:none}
.ai-search-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:#00ffa3;color:#0a0a1a;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:bold}
.ai-welcome{text-align:center;padding:40px 15px;color:#888}
.ai-welcome h2{color:#00ffa3;margin-bottom:10px;font-size:1.3em}
.ai-suggestions{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:15px}
.ai-suggestions button{padding:8px 14px;border:1px solid #3a3a5a;border-radius:20px;background:transparent;color:#aaa;cursor:pointer;font-size:.82em;transition:.3s}
.ai-suggestions button:hover{border-color:#00ffa3;color:#00ffa3}
.ai-result{background:#12122a;border:1px solid #1e1e3a;border-radius:10px;padding:15px;cursor:pointer;transition:.2s;margin-bottom:8px}
.ai-result:hover{border-color:#00ffa3}
.ai-result h4{color:#00ffa3;font-size:.9em;margin-bottom:4px}
.ai-result .ai-chapter{color:#888;font-size:.75em;margin-bottom:6px}
.ai-result .ai-snippet{font-size:.85em;line-height:1.5}
.ai-card-match{background:#1a1a3a;border-radius:8px;padding:10px 14px;margin-top:8px;border-left:3px solid #ffd700;margin-bottom:8px}
.ai-card-match .ai-card-q{color:#ffd700;font-size:.85em;font-weight:bold}
.ai-card-match .ai-card-a{color:#00ffa3;font-size:.85em;margin-top:3px}
.ai-no-results{text-align:center;padding:30px;color:#888}
.ai-no-results h3{color:#ff6b6b;margin-bottom:8px}
/* LOGIN / ACCOUNTS */
.login-screen{display:flex;justify-content:center;align-items:center;min-height:100vh;flex-direction:column;text-align:center;padding:20px}
.login-screen h1{color:#00ffa3;font-size:2em;margin-bottom:8px}
.login-screen p{color:#888;margin-bottom:20px;font-size:.9em}
.login-screen input{padding:12px 20px;border:2px solid #2a2a4a;border-radius:10px;background:#0f0f25;color:#fff;font-size:1.1em;text-align:center;width:220px;margin-bottom:10px}
.login-screen input:focus{border-color:#00ffa3;outline:none}
.login-btn{padding:10px 30px;border:none;border-radius:10px;background:#00ffa3;color:#0a0a1a;font-size:1em;font-weight:bold;cursor:pointer}
.login-btn:hover{background:#00dd8a}
.login-err{color:#ff4444;margin-top:10px;display:none}
.acct-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:20px 0}
.acct-card{width:140px;padding:20px 15px;border:2px solid #2a2a4a;border-radius:14px;background:#12122a;cursor:pointer;transition:.3s;text-align:center}
.acct-card:hover{border-color:#00ffa3;background:#151540}
.acct-card .acct-emoji{font-size:2.5em;margin-bottom:8px}
.acct-card .acct-name{color:#00ffa3;font-weight:bold;font-size:1em}
.acct-card.guest{border-color:#555}.acct-card.guest:hover{border-color:#888}
.acct-card.guest .acct-name{color:#888}
/* DASHBOARD */
.dash{max-width:800px;margin:0 auto}
.dash h2{color:#00ffa3;text-align:center;margin-bottom:20px}
.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:20px}
.goal-card{background:#12122a;border:1px solid #1e1e3a;border-radius:10px;padding:12px;text-align:center}
.goal-card.main{border-color:#ffd700;background:#1a1a0a}
.goal-card h4{font-size:.8em;margin-bottom:6px;color:#aaa}
.goal-card .goal-score{font-size:1.8em;font-weight:bold}
.goal-card .goal-score.pass{color:#00ffa3}
.goal-card .goal-score.fail{color:#ff4444}
.goal-card .goal-target{font-size:.75em;color:#888;margin-top:4px}
.goal-card .goal-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7em;font-weight:bold;margin-top:6px}
.goal-card .goal-tag.main-tag{background:#ffd700;color:#0a0a1a}
.goal-card .goal-tag.sub-tag{background:#1a1a3a;color:#888}
.hist-table{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:.85em}
.hist-table th{color:#00ffa3;padding:8px;text-align:left;border-bottom:2px solid #2a2a4a}
.hist-table td{padding:8px;border-bottom:1px solid #1a1a3a}
.weak-list{margin-bottom:20px}
.weak-item{background:#2a1a1a;border-left:3px solid #ff4444;padding:8px 14px;border-radius:0 8px 8px 0;margin-bottom:6px;font-size:.85em}
.weak-item span{color:#ff4444;font-weight:bold}
.reminder-banner{background:linear-gradient(90deg,#2a1a0a,#1a1a0a);border:1px solid #ffd700;border-radius:10px;padding:15px;text-align:center;margin-bottom:20px}
.reminder-banner h3{color:#ffd700;margin-bottom:5px}
.reminder-banner p{color:#ccc;font-size:.88em}
/* COINS & SHOP */
.coin-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;background:#2a2a0a;border:1px solid #ffd700;color:#ffd700;font-size:.8em;font-weight:bold;margin-left:8px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:20px 0}
.shop-item{background:#12122a;border:2px solid #1e1e3a;border-radius:14px;padding:20px;text-align:center;transition:.3s}
.shop-item:hover{border-color:#ffd700}
.shop-item .shop-emoji{font-size:2.5em;margin-bottom:8px}
.shop-item h4{color:#ffd700;margin-bottom:4px}
.shop-item p{color:#888;font-size:.82em;margin-bottom:10px}
.shop-item .shop-price{color:#ffd700;font-weight:bold;font-size:1.1em;margin-bottom:10px}
.shop-buy{padding:8px 20px;border:none;border-radius:8px;background:#ffd700;color:#0a0a1a;font-weight:bold;cursor:pointer;font-size:.88em}
.shop-buy:hover{background:#ffed4a}
.shop-buy:disabled{background:#333;color:#555;cursor:not-allowed}
.inv-grid{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
.inv-item{padding:8px 14px;border:1px solid #3a3a5a;border-radius:8px;background:#1a1a3a;color:#ccc;font-size:.85em;display:flex;align-items:center;gap:6px}
.inv-item button{padding:3px 10px;border:none;border-radius:5px;background:#00ffa3;color:#0a0a1a;cursor:pointer;font-size:.8em;font-weight:bold}
.daily-quest{background:#12122a;border:1px solid #1e1e3a;border-radius:10px;padding:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.daily-quest.done{border-color:#00ffa3;opacity:.7}
.daily-quest.frozen{border-color:#64b5f6;opacity:.7}
.daily-quest h4{font-size:.88em;margin-bottom:3px}
.daily-quest .dq-reward{color:#ffd700;font-size:.8em}
.daily-quest .dq-status{font-size:.85em;font-weight:bold}
.daily-quest .dq-btn{padding:6px 14px;border:none;border-radius:8px;background:#ffd700;color:#0a0a1a;font-weight:bold;cursor:pointer;font-size:.85em}
.daily-quest .dq-btn:hover{background:#ffed4a}
.gamble-result{text-align:center;padding:20px;background:#12122a;border-radius:14px;border:2px solid #ffd700;margin:20px auto;max-width:300px}
.gamble-result .gamble-emoji{font-size:3em;margin-bottom:10px}
.gamble-result h3{margin-bottom:5px}
.odds-table{width:100%;max-width:300px;margin:10px auto;border-collapse:collapse;font-size:.85em}
.odds-table th{color:#ffd700;padding:6px;text-align:left;border-bottom:1px solid #2a2a4a}
.odds-table td{padding:6px;border-bottom:1px solid #1a1a3a}
.heat-banner{background:linear-gradient(90deg,#2a0a0a,#1a0a0a);border:2px solid #ff4444;border-radius:14px;padding:20px;text-align:center;margin:15px 0}
.heat-banner h3{color:#ff4444;margin-bottom:5px}
@media(max-width:600px){.topbar h1{width:100%;font-size:1em}.ch-bar{padding:4px 10px}.fc-wrap{height:220px}.tabs{gap:3px}.tabs button{padding:5px 10px;font-size:.78em}.acct-card{width:120px;padding:15px 10px}.goal-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<!-- SCREEN 1: Main Password -->
<div id="lock-screen" class="login-screen">
<h1>📚 Study Hub</h1>
<p>Enter password to access</p>
<input type="password" id="pw-input" placeholder="Password" onkeydown="if(event.key==='Enter')checkPW()">
<button class="login-btn" onclick="checkPW()">Enter</button>
<p class="login-err" id="pw-err">Wrong password!</p>
</div>

<!-- SCREEN 2: Account Select -->
<div id="acct-screen" class="login-screen" style="display:none">
<h1>📚 Study Hub</h1>
<p>Who's studying?</p>
<div class="acct-grid" id="acct-grid"></div>
</div>

<!-- SCREEN 3: Account Password -->
<div id="acct-pw-screen" class="login-screen" style="display:none">
<h1 id="acct-pw-title">👤</h1>
<p>Enter your password</p>
<input type="password" id="acct-pw-input" placeholder="Password" onkeydown="if(event.key==='Enter')checkAcctPW()">
<button class="login-btn" onclick="checkAcctPW()">Login</button>
<button class="login-btn" onclick="showAcctScreen()" style="background:#1a1a3a;color:#888;margin-top:8px">← Back</button>
<p class="login-err" id="acct-pw-err">Wrong password!</p>
</div>

<!-- MAIN APP -->
<div id="main-app" style="display:none">
<div class="topbar">
<h1>📚 Study Hub</h1>
<div class="tabs">
<button onclick="showSec('dash')" id="tb-dash">📊 Dashboard</button>
<button onclick="showSec('booklet')" id="tb-booklet">📖 Booklet</button>
<button onclick="showSec('flash')" id="tb-flash">🃏 Cards</button>
<button onclick="showSec('quiz')" id="tb-quiz">❓ Quiz</button>
<button onclick="showSec('fib')" id="tb-fib">✏️ Fill-Blank</button>
<button onclick="showSec('multi')" id="tb-multi">👥 Multiplayer</button>
<button onclick="showSec('shop')" id="tb-shop">🪙 Shop</button>

<script id="chdata">
const CH={
earth:{name:"🌍 Ch1: Earth Science",
topics:[
{t:"Earth's Layers: The Core",c:`<p>The Earth is made of several layers, each with unique characteristics. Scientists discovered these layers using <span class="key">seismology</span> — the study of how waves of energy (from earthquakes) travel through the Earth. By observing how these waves bend or refract, scientists understand the density and state of each layer.</p>
<h4>Inner Core</h4>
<ul><li>~1,216 km thick</li><li><span class="key">Solid</span> — despite extreme heat (~5,000–6,000°C), immense pressure keeps it solid (the whole planet pressing down on it!)</li><li>Made of <span class="key">iron and nickel</span> with a few other elements</li><li>About the size of Pluto</li><li>The solid inner core <span class="key">rotates within</span> the liquid outer core</li><li>The hottest region is actually at the <span class="key">boundary between outer and inner core</span> — about as hot as the surface of the Sun!</li></ul>
<h4>Outer Core</h4>
<ul><li>~2,270 km thick</li><li><span class="key">Liquid</span> — iron and nickel in molten state (less pressure than inner core)</li><li>Flows easily → currents of moving liquid metal create Earth's <span class="key">magnetic field</span></li><li>The magnetic field protects Earth from harmful solar radiation</li></ul>
<h4>Heat Sources</h4>
<p>The core is Earth's source of internal heat. Most heat is leftover from Earth's formation, but more is constantly produced from: 1) <span class="key">radioactive decay</span> in mantle and crust, and 2) liquid metal of the outer core <span class="key">solidifying</span> at the inner core boundary (releases heat).</p>
<div class="note">In 1936, <span class="key">Inge Lehmann</span>, a pioneering woman seismologist from Denmark, used earthquake evidence to prove Earth had a solid core.</div>`},

{t:"Earth's Layers: Mantle",c:`<p>The mantle makes up about <span class="key">84% of Earth's volume</span>.</p>
<h4>Lower Mantle</h4>
<ul><li>~2,885 km thick</li><li>Hot and dense, but high pressure keeps it more solid</li><li>Temperatures near core-mantle boundary: 3,000–4,000°C</li></ul>
<h4>Transition Zone (400–660 km depth)</h4>
<p>Between lower and upper mantle. High temperature and pressure cause changes to the <span class="key">crystal structure of minerals</span> within the rock, creating a relatively thin layer different from rock above and below it.</p>
<h4>Upper Mantle</h4>
<p>Extends from ~400 km to the crust. Less dense and cooler (500–900°C near top, up to 1,500°C near base).</p>
<ul><li><span class="key">Asthenosphere</span> — near the top of the upper mantle, pressure is lower so rock can <span class="key">soften and partly melt</span> to become partially molten. This flowing rock allows tectonic plates to move! (Greek: "a" + "sthenos" = "without strength" + "sphaira" = "ball")</li>
<li><span class="key">Lithosphere</span> — rigid, brittle layer above the asthenosphere. Includes the crust AND the very top part of the upper mantle. Broken into <span class="key">tectonic plates</span> that float and shift on the softer asthenosphere. Temperatures: surface temp up to 500–900°C near base. (Greek: "lithos" = "rocky")</li></ul>`},

{t:"Earth's Layers: Crust & Human Exploration",c:`<h4>The Crust</h4>
<ul><li><span class="key">Oceanic crust</span> — thin (<5 km), dense, mostly basalt</li>
<li><span class="key">Continental crust</span> — thick (up to 80 km), less dense, mostly granite</li>
<li>Temperature near mantle: ~500°C. Near surface: same as air temperature</li></ul>
<p>Where the crust is thin, liquid rock can come to the surface (volcanoes).</p>
<h4>Project Mohole (1960s)</h4>
<p>An attempt to drill through the crust to reach the <span class="key">Mohorovičić Discontinuity (Moho)</span> — the boundary between crust and mantle. Five holes drilled into ocean floor (water 3,600 m deep). Deepest hole: 183 m. Project didn't continue but taught scientists about deep-water drilling.</p>
<h4>Kola Superdeep Borehole</h4>
<p>Started in 1970 by Soviet geologists on the Kola Peninsula (near Finland). Deepest borehole: <span class="key">12,262 m</span> (1989) — deepest artificial point on Earth. Expected 100°C but found <span class="key">180°C</span>! Rock was turning gooey, so the project stopped.</p>
<h4>Modern Deep Drilling</h4>
<ul><li>In 2022, <span class="key">Adnoc</span> (Abu Dhabi) set the record for longest oil/gas well: 15,240 m</li>
<li><span class="key">Quaise Energy</span> (founded 2020) wants to drill 20 km deep to capture geothermal energy using technology that vaporizes rock. In July 2025, they reached 100 m through Earth's hardest rock.</li></ul>
<div class="note">Humans know more about the edge of the Universe than what lies beneath the Earth's crust!</div>`},

{t:"Continental Drift & Evidence",c:`<h4>Alfred Wegener's Theory</h4>
<p>In the early 1900s, German scientist <span class="key">Alfred Wegener</span> suggested all continents were once joined in a supercontinent called <span class="key">Pangaea</span> (~225 million years ago). Greek: "pan" = entire, "Gaia" = Earth.</p>
<p>After Pangaea broke apart, landmasses formed new continents like <span class="key">Laurasia</span>, continuing to shift through the Jurassic and Cretaceous periods.</p>
<h4>Evidence Supporting Continental Drift</h4>
<ul><li><span class="key">Coastline fit</span> — Africa and South America fit like puzzle pieces</li>
<li><span class="key">Fossil evidence</span> — Mesosaurus (freshwater reptile) found in both Brazil AND western Africa. Lystrosaurus (land reptile) found in Africa, India, AND Antarctica</li>
<li><span class="key">Rock evidence</span> — similar rock types and mountain ranges match across continents</li>
<li><span class="key">Climate evidence</span> — tropical plant fossils in now-cold regions, glacial scratches in now-warm places</li></ul>
<p>Scientists rejected Wegener because: 1) He couldn't explain HOW continents move (first suggested Earth's rotation — wrong). 2) He was a <span class="key">meteorologist</span>, not a geologist, so they didn't take him seriously. The mechanism wasn't discovered until the late 1950s/60s with <span class="key">seafloor spreading</span>.</p>
<p>Scientists now think other supercontinents may have existed BEFORE Pangaea.</p>`},

{t:"Plate Tectonics & Boundaries",c:`<h4>Theory of Plate Tectonics</h4>
<p>Builds on Wegener's theory. It is <span class="key">tectonic plates</span> (rigid sections of lithosphere), not just continents, that move. Plates sit on the asthenosphere (softer, partially molten). The difference in rigidity allows plates to move.</p>
<h4>7 Major Plates</h4>
<p>African, Antarctic, Eurasian, Australian, North American, Pacific, South American. Plus 8 smaller secondary plates and other microplates.</p>
<p>Speed: <span class="key">10–160 mm/year</span> (10 mm = fingernail growth speed, 160 mm = hair growth speed).</p>
<p>Tectonic plates move land AND oceans (both are on the crust).</p>
<h4>3 Types of Boundaries</h4>
<ul><li><span class="key">Convergent</span> — plates move TOWARD each other</li>
<li><span class="key">Divergent</span> — plates move APART (seafloor spreading)</li>
<li><span class="key">Transform</span> — plates SLIDE past each other</li></ul>
<h4>Convergent: 3 Sub-types</h4>
<ul><li><span class="key">Oceanic-Continental</span>: Dense oceanic plate sinks under lighter continental plate (<span class="key">subduction</span>). Oceanic plate may melt in mantle → magma rises through weak spots → volcanic cones. Creates powerful earthquakes. Example: <span class="key">Andes Mountains</span> (Nazca under South American).</li>
<li><span class="key">Oceanic-Oceanic</span>: Older (denser) plate subducts under younger. Underwater volcanoes form → can produce powerful earthquakes.</li>
<li><span class="key">Continental-Continental</span>: Neither dense enough to subduct → plates crunch and fold → <span class="key">obduction</span> (pushed UP) → mountains. Example: <span class="key">Himalayas</span> (Indian + Eurasian). Actually started with oceanic plate subducting, then when it reached continental crust, the collision pushed crust upward.</li></ul>
<h4>Earthquakes: Stick-Slip Cycle</h4>
<p>Tectonic plates are jagged rock — they DON'T glide smoothly. They <span class="key">repeatedly get stuck</span>, building pressure. When pressure becomes too great, plates suddenly <span class="key">jump (slip)</span>. This stick-slip cycle produces earthquakes. Longer pressure buildup = stronger quake.</p>`},

{t:"Divergent & Transform Boundaries",c:`<h4>Divergent Boundaries</h4>
<p>Less violent than convergent, but still dramatic. As plates pull apart, cracks form → hot molten rock rises → cools to form new crust. New ocean crust at divergent boundaries <span class="key">balances crust lost through subduction</span> at convergent ones.</p>
<h4>Mid-Atlantic Ridge</h4>
<p>Extends from the Arctic Ocean to beyond the southern tip of Africa. Has so many volcanoes it's considered the <span class="key">longest mountain range in the world</span>! With enough volcanic activity, mountains grow above sea → <span class="key">Iceland</span> is one of these volcanic islands, sitting right on the Mid-Atlantic Ridge.</p>
<h4>Transform Boundaries</h4>
<p>Plates slide horizontally past each other. NO volcanoes, but CAN generate powerful earthquakes through the stick-slip cycle.</p>
<p>Most famous: <span class="key">San Andreas Fault</span> in California.</p>
<div class="note">Earthquakes happen at ALL three boundary types. Understanding plate movement helps predict geological events like earthquakes and tsunamis — saving lives.</div>`},

{t:"Minerals: Properties & Identification",c:`<h4>What is a Mineral?</h4>
<p>Naturally occurring, solid, inorganic (not made by living things), with a regular repeating arrangement of atoms. Study of minerals = <span class="key">mineralogy</span>. Over <span class="key">5,400 minerals</span> acknowledged by the International Mineralogical Association (IMA).</p>
<h4>Properties for Identification</h4>
<ul><li><span class="key">Habit</span> — crystal shape (cube, prism, pyramid)</li>
<li><span class="key">Colour</span> — unreliable alone (many minerals share colours)</li>
<li><span class="key">Streak test</span> — rub mineral on unglazed porcelain → powder colour. More reliable than surface colour because it doesn't change from weathering or impurities</li>
<li><span class="key">Lustre</span> — how light reacts: metallic (pyrite), pearly (gypsum), dull (talc), greasy, waxy, vitreous (glassy)</li>
<li><span class="key">Hardness (Mohs Scale)</span> — 1 (talc) to 10 (diamond). Fingernail ≈ 2.5, penny ≈ 3.5, glass ≈ 5.5. A mineral only gets scratched by something HARDER</li>
<li><span class="key">Translucency</span> — transparent (quartz), translucent (some light), opaque (no light)</li>
<li><span class="key">Cleavage vs Fracture</span> — cleavage = breaks along flat geometric surfaces. Fracture = breaks irregularly</li>
<li>Also test reactions to <span class="key">acids</span> or <span class="key">magnets</span></li></ul>`},

{t:"Uses of Minerals",c:`<h4>Base Metals</h4>
<p>Copper, lead, iron, nickel, tin, zinc, aluminum. Used for wiring, pipes, roofing, food containers, pop cans, batteries, coins. Copper + tin = <span class="key">bronze</span> (strong — used for swords/shields in ancient times!).</p>
<h4>Precious Metals</h4>
<p>Gold, silver, platinum. Used in jewellery, tooth fillings, coins, electronics. Many are used as <span class="key">catalysts</span> in chemical reactions.</p>
<h4>Industrial Minerals</h4>
<p>Minerals without metals. Quartz → glass. Lithium + graphite → batteries. Diamonds → drill bits (hardest mineral!).</p>
<h4>Minerals in Farming</h4>
<p>Essential for plant growth! Fertilizers add: <span class="key">Nitrogen</span> (green/lush leaves), <span class="key">Phosphorus</span> (strong roots/flowers), <span class="key">Potassium</span> (strong stems, disease resistance). Without these, crops grow poorly.</p>
<h4>Minerals in Daily Life</h4>
<ul><li><span class="key">Calcium carbonate</span> — in toothpaste</li>
<li><span class="key">Talc</span> — in powders</li>
<li><span class="key">Potassium</span> — in soaps</li>
<li>Calcium from milk AND vegetables (broccoli, pickles, leafy greens)</li>
<li><span class="key">Zinc oxide</span> — sunscreen</li>
<li><span class="key">Galvanization</span> — coating iron/steel with zinc to prevent rusting</li></ul>`},

{t:"Rocks: Igneous, Sedimentary, Metamorphic",c:`<h4>Igneous Rock — "Fire Rock" (Latin: ignis = fire)</h4>
<ul><li><span class="key">Intrusive (plutonic)</span> — cools SLOWLY below surface → large crystals visible (e.g., <span class="key">granite</span> — quartz grey, potassium feldspar pink, biotite black)</li>
<li><span class="key">Extrusive (volcanic)</span> — cools QUICKLY on surface → small/no crystals (e.g., <span class="key">obsidian</span> — shiny black, pumice, rhyolite, basalt)</li></ul>
<h4>Sedimentary Rock — "Layer Rock"</h4>
<p>Formed from layers of sediment (small particles worn down by water, wind, or ice) deposited and compressed. <span class="key">Fossils are ONLY found in sedimentary rock!</span></p>
<ul><li><span class="key">Limestone</span> — calcium carbonate (calcite + aragonite), often contains fossils from ancient oceans</li>
<li><span class="key">Shale</span> — silt and clay particles, breaks into thin layers. The <span class="key">Burgess Shale</span> (Canadian Rockies, Burgess Pass) — one of the BEST fossil sites in the world! Fossils from the Cambrian period (545–525 million years ago) when ALL life lived in the ocean</li>
<li><span class="key">Sandstone</span> — sand grains (quartz + feldspar), may show coloured bands or wave ridges</li>
<li><span class="key">Conglomerate</span> — rounded rock pieces cemented with sand and clay</li></ul>
<p>The shore of the <span class="key">Bay of Fundy</span> (Nova Scotia/New Brunswick) is a great place to see exposed sedimentary rock.</p>
<h4>Metamorphic Rock — "Changed Rock" (metamorphosis = change in form)</h4>
<ul><li><span class="key">Marble</span> ← limestone. Many colours, usually no layers, cracks or squiggly lines</li>
<li><span class="key">Slate</span> ← shale. Much harder than shale, uniform colour (grey or brownish)</li>
<li><span class="key">Quartzite</span> ← sandstone</li>
<li><span class="key">Gneiss</span> (pronounced "nice") ← igneous or sedimentary rock. Parallel, somewhat irregular bands of colour. Contains feldspar and quartz.</li></ul>
<h4>The Rock Cycle</h4>
<p>Rocks continuously change between types through melting, cooling, weathering, erosion, compression, and heat/pressure. No rock is permanent!</p>`},

{t:"Weathering, Erosion & Soil",c:`<h4>Weathering = Breaking Down (rock stays in place)</h4>
<ul><li><span class="key">Physical/Mechanical</span> — frost wedging (water freezes in cracks → expands), root growth, abrasion</li>
<li><span class="key">Chemical</span> — acid rain dissolving limestone, oxidation (rusting), water reacting with minerals</li>
<li><span class="key">Biological</span> — organisms (lichens, burrowing animals, tree roots)</li></ul>
<h4>Erosion = Moving the Pieces</h4>
<p>After weathering breaks rock, erosion MOVES pieces by water, wind, ice (glaciers), or gravity.</p>
<h4>Soil Horizons (top → bottom)</h4>
<ul><li><span class="key">O horizon</span> — organic matter (decomposing leaves, organisms)</li>
<li><span class="key">A horizon (topsoil)</span> — dark, nutrient-rich, best for plants</li>
<li><span class="key">B horizon (subsoil)</span> — minerals washed down (leaching)</li>
<li><span class="key">C horizon</span> — broken/weathered rock fragments</li>
<li><span class="key">R horizon (bedrock)</span> — solid, unweathered rock</li></ul>
<div class="note">Soil forms VERY slowly — hundreds to thousands of years for just a few cm of topsoil!</div>`},

{t:"Uses of Rocks",c:`<ul><li><span class="key">Building material</span> — roads, houses, stores. Buildings made of rock can last hundreds to thousands of years! (e.g., Petit Champlain, Quebec City)</li>
<li><span class="key">Concrete</span> — made from broken/crushed rocks</li>
<li><span class="key">Railway ballast</span> — rocks around railway tracks for stability</li>
<li><span class="key">Rock Art</span> — found across Canada:
<ul><li><span class="key">Pictographs</span> — images painted on rocks or in caves</li>
<li><span class="key">Petroglyphs</span> — images carved or scratched into rock surface</li>
<li>Over 1,300 petroglyph and pictograph sites found in BC!</li>
<li>The <span class="key">Agawa Rock Pictographs</span> (Lake Superior Provincial Park, Ontario) — Mishibizhiw (Great Lynx), canoes, snakes — created by the Ojibway people in the 17th or 18th centuries</li></ul></li>
<li><span class="key">Inuit soapstone sculptures</span> — carved from serpentine stone in northern Canada</li></ul>`},

{t:"Mining in Canada",c:`<h4>Types of Mines</h4>
<ul><li><span class="key">Surface mines (open pit)</span> — ore near surface, dig big open pit</li>
<li><span class="key">Underground mines</span> — ore deep, use tunnels</li></ul>
<h4>Steps in Mining</h4>
<ol><li>Ore is dug up</li><li>Big pieces blasted into smaller pieces</li><li>Pieces loaded onto trucks</li><li>Trucks take ore to a <span class="key">mill</span> (processing plant) where it is crushed</li><li>Valuable minerals separated from non-valuable rock</li></ol>
<h4>Mine Life Cycle</h4>
<ol><li><span class="key">Exploration</span> — prospectors and scientists search for rocks/minerals, analyze samples at <span class="key">assay offices</span></li>
<li><span class="key">Development</span> — plan, community consultation, environmental assessment, government permits</li>
<li><span class="key">Operation</span> — drilling holes → blasting → excavating → transporting to mill → crushing → chemical extraction. Safety and environmental management throughout.</li>
<li><span class="key">Closure & Reclamation</span> — remove buildings/equipment, re-establish vegetation, monitor soil/water recovery for years. Can include wildlife habitat, recreation, or agriculture after.</li></ol>
<h4>Canada: 12 provinces/territories mine (only PEI has no mines). 60+ minerals and metals.</h4>
<h4>What's Mined Where</h4>
<ul><li><span class="key">Iron</span> — Quebec, Nunavut, NL → makes steel</li>
<li><span class="key">Copper</span> — BC produces most → wiring, power generation, plumbing, pots/pans (conducts electricity AND heat)</li>
<li><span class="key">Gold</span> — Ontario produces most → electronics, computers, jewellery, dentistry, medicine</li>
<li><span class="key">Zinc</span> — Manitoba produces most → mixed with other metals for brass, musical instruments, car parts, fertilizers. Zinc oxide → sunscreen. Galvanization (coating iron/steel to prevent rust)</li>
<li><span class="key">Uranium</span> — ONLY mined in Saskatchewan → nuclear power (radioactive atoms decay → release heat → steam → turbines → electricity)</li>
<li><span class="key">Diamonds</span> — NWT (Ekati, Diavik, Gahcho Kué), Ontario, Quebec. Canada = 3rd largest producer (after Russia and Botswana). First mine: Ekati (1998), ~300 km NE of Yellowknife. 2024 production: ~16 million carats. Used as abrasive, drill bits, jewellery</li></ul>`},

{t:"Scandium: From Trash to Treasure",c:`<p><span class="key">Scandium</span> is a rare earth element (from Latin "scandia" = Scandinavia, where it was discovered).</p>
<p>A soft silvery metal, lightweight like aluminum. Listed as a <span class="key">"critical mineral"</span> by Canada, US, Australia, and EU — necessary for important products but hard to get.</p>
<h4>Why It's Important</h4>
<p>Combined with other metals (titanium, aluminum, zirconium) to form <span class="key">alloys</span>. Scandium-aluminum alloys are <span class="key">stronger than pure aluminum</span> while still flexible, heat-resistant, and corrosion-resistant.</p>
<h4>Uses</h4>
<ul><li><span class="key">Aerospace</span> — aircraft wings and fuselage (light + strong)</li>
<li>Car and rocket parts</li>
<li><span class="key">Sports equipment</span> — golf clubs, baseball bats, bicycle frames</li></ul>
<h4>Rio Tinto's Solution</h4>
<p>Found in 800+ minerals worldwide (including BC and Quebec) but in small amounts mixed with other minerals — expensive to extract. Rio Tinto scientists found a way to extract scandium from <span class="key">waste residues from titanium mining</span> at their Technology Centre in <span class="key">Sorel-Tracy, Quebec</span> (operating 75+ years).</p>
<p>In 2022, became <span class="key">first North American producer</span> of scandium. Currently produces 3 tonnes of scandium oxide/year, plans to quadruple to 12 tonnes. Uses <span class="key">hydropower</span> (renewable clean energy). Important because it recovers valuable material from waste while reducing environmental impact.</p>
<div class="note">Over 800 different minerals contain scandium!</div>`},
],

{q:"What are Earth's 4 main layers (inside→out)?",a:"Inner core (solid), outer core (liquid), mantle, crust"},
{q:"What creates Earth's magnetic field?",a:"Convection currents of liquid iron/nickel in the outer core"},
{q:"What is the asthenosphere?",a:"Partially molten layer in the upper mantle — plates float on it (Greek: 'without strength')"},
{q:"What is the lithosphere?",a:"Rigid layer = crust + top of upper mantle, broken into tectonic plates (Greek: 'rocky ball')"},
{q:"What is the transition zone?",a:"400-660 km depth — crystal structure of minerals changes between lower and upper mantle"},
{q:"Who proved Earth has a solid core?",a:"Inge Lehmann (Danish seismologist, 1936) — used earthquake evidence"},
{q:"What was Pangaea?",a:"Supercontinent ~225 million years ago (Greek: pan=all + Gaia=Earth)"},
{q:"Who proposed Continental Drift?",a:"Alfred Wegener (German meteorologist, early 1900s)"},
{q:"Why was Wegener rejected?",a:"1) Couldn't explain HOW continents move. 2) Was a meteorologist, not geologist"},
{q:"What is seafloor spreading?",a:"At divergent boundaries, magma rises to fill cracks → forms new ocean floor"},
{q:"Name 3 types of plate boundaries",a:"Convergent (toward), Divergent (apart), Transform (slide past)"},
{q:"Subduction vs Obduction?",a:"Subduction = plate pushed UNDER. Obduction = plate pushed UP (mountains)"},
{q:"3 types of convergent boundaries?",a:"Oceanic-Continental, Oceanic-Oceanic, Continental-Continental"},
{q:"What causes earthquakes?",a:"Stick-slip cycle — jagged plates get stuck, pressure builds, then suddenly slip"},
{q:"What is the Mid-Atlantic Ridge?",a:"Longest mountain range in the world — divergent boundary from Arctic to South Africa. Iceland sits on it!"},
{q:"What is the San Andreas Fault?",a:"Transform boundary in California — plates slide past each other"},
{q:"What is seismology?",a:"Study of earthquake waves — reveals Earth's interior structure"},
{q:"What is the Mohs Scale?",a:"Mineral hardness: 1 (talc) to 10 (diamond). Fingernail≈2.5, penny≈3.5, glass≈5.5"},
{q:"Streak test vs colour?",a:"Streak (powder colour on porcelain) is MORE reliable — doesn't change from weathering"},
{q:"What is lustre?",a:"How light reacts with mineral: metallic, pearly, dull, waxy, greasy, vitreous (glassy)"},
{q:"What is cleavage vs fracture?",a:"Cleavage = breaks along flat planes. Fracture = breaks irregularly"},
{q:"Name the 3 rock types",a:"Igneous (cooled magma), Sedimentary (compressed layers), Metamorphic (heat+pressure changed)"},
{q:"Where are fossils ONLY found?",a:"Sedimentary rock"},
{q:"Intrusive vs Extrusive igneous?",a:"Intrusive = slow cooling underground = big crystals (granite). Extrusive = fast cooling on surface = tiny/no crystals (obsidian)"},
{q:"Marble comes from?",a:"Limestone (metamorphic)"},
{q:"Slate comes from?",a:"Shale (metamorphic)"},
{q:"What is gneiss?",a:"Metamorphic rock (pronounced 'nice') — parallel colour bands, from granite or sedimentary rock"},
{q:"What is the Burgess Shale?",a:"Famous shale in Canadian Rockies — best Cambrian fossils (545-525 million years ago)"},
{q:"Weathering vs erosion?",a:"Weathering BREAKS rock down (in place). Erosion MOVES the broken pieces (water/wind/ice/gravity)"},
{q:"Soil horizons top→bottom?",a:"O (organic), A (topsoil), B (subsoil), C (broken rock), R (bedrock)"},
{q:"What are petroglyphs vs pictographs?",a:"Petroglyphs = carved/scratched into rock. Pictographs = painted on rock/caves"},
{q:"What is galvanization?",a:"Coating iron/steel with zinc to prevent rusting"},
{q:"What minerals do plants need?",a:"Nitrogen (leaves), Phosphorus (roots), Potassium (stems/disease resistance)"},
{q:"4 stages of mine life cycle?",a:"Exploration → Development → Operation → Closure/Reclamation"},
{q:"Uranium is ONLY mined where?",a:"Saskatchewan"},
{q:"Which province produces most copper?",a:"British Columbia"},
{q:"What is scandium used for?",a:"Lightweight strong alloys with aluminum — aircraft, spacecraft, sports equipment"},
{q:"Where does Rio Tinto produce scandium?",a:"Sorel-Tracy, Quebec — extracted from titanium mining waste (first in North America, 2022)"},
{q:"What is the Kola Superdeep Borehole?",a:"12,262 m deep (Russia, 1989). Expected 100°C, found 180°C. Deepest artificial point on Earth"},
{q:"What is Project Mohole?",a:"1960s attempt to drill through ocean crust to the Moho (crust-mantle boundary). Reached 183 m."},
{q:"How fast do plates move?",a:"10-160 mm/year (fingernail to hair growth speed)"},
{q:"Canada is the ___ largest diamond producer",a:"3rd (after Russia and Botswana). First mine: Ekati (1998, NWT)"},

math:{name:"🔢 Ch2: Math",topics:[
{t:"Data Visualization",c:`<p><span class="key">Data visualization</span> = turning data into pictures so patterns are easier to understand.</p>
<h4>Types</h4>
<ul><li><span class="key">Bar graphs</span> — compare quantities</li>
<li><span class="key">Pie charts</span> — parts of a whole</li>
<li><span class="key">Line graphs</span> — change over time</li>
<li><span class="key">Warming stripes</span> — colour strips showing temp change. Created by <span class="key">Prof. Ed Hawkins</span> (University of Reading). Blue=cold, red=warm (1850-2021).</li>
<li><span class="key">Infographics</span> — graphics + data + text (Tableau, Canva, Visme)</li>
<li><span class="key">Relief maps</span> — 3D terrain representations</li>
<li><span class="key">Interactive visualizations</span> — online, clickable/explorable</li></ul>`},

{t:"Data Accessibility & Sonification",c:`<h4>Making Visualizations Accessible</h4>
<p>Use readable fonts, high-contrast colours, well-organized layouts.</p>
<ul><li><span class="key">Alt text</span> — 1-2 sentence hidden description read by screen readers</li>
<li><span class="key">Long text descriptions</span> — 4-5 sentences under the image</li>
<li>Colour alone can fail people with <span class="key">colour vision deficiency</span></li></ul>
<h4>Sonification</h4>
<p><span class="key">Sonification</span> = turning data into sound/music. NASA used Pleiades supercomputer to turn Martian cloud data into flute music (performed by Alyssa Schwartz). CO₂ data turned into plucked strings — more CO₂ = louder. Downside: not accessible to hearing-impaired people.</p>
<div class="note"><span class="key">Synesthesia</span>: Condition where senses cross over — seeing colours when hearing music, hearing sounds when seeing movement. Brain links senses more strongly than usual.</div>`},

{t:"Theoretical Probability",c:`<h4>What is Probability?</h4>
<p>Measures likelihood. Scale: <span class="key">0 (impossible) to 1 (certain)</span> = 0%-100%.</p>
<div class="formula">Theoretical Probability = desired outcomes ÷ total possible outcomes</div>
<p>Coin: P(heads) = 1/2 = 50%. All probabilities MUST add up to 1.</p>
<h4>Spinner Example</h4>
<p>4-number spinner: P(1) = 1/4 = 25%. P(even) = 2/4 = 50%. P(>4) = 0/4 = 0%. P(<6) = 4/4 = 100%.</p>
<p>Decimal→%: ×100. %→decimal: ÷100.</p>`},

{t:"Experimental Probability & POP",c:`<h4>Experimental Probability</h4>
<div class="formula">Experimental Prob. = times happened ÷ number of experiments</div>
<p>10 flips, 4 heads: exp P(heads) = 4/10 = 40%. Differs from 50% due to <span class="key">randomness</span>. <span class="key">MORE trials → CLOSER to theoretical.</span></p>
<h4>POP (Probability of Precipitation)</h4>
<div class="formula">POP = confidence × coverage</div>
<p>100% confident × 60% area = 60%. 80% confident × 30% area = 0.8 × 0.3 = 24%.</p>
<p>5-day forecast ~90% accurate. 7-day ~80%. 10-day only ~50%!</p>
<h4>Batting Average</h4>
<div class="formula">Batting Average = hits ÷ at-bats</div>
<p>90/300 = 0.300 (excellent — 1 out of 3).</p>`},

{t:"Probability & Health",c:`<p>Doctors use probability to predict health risks.</p>
<h4>Heart Disease Risk Factors</h4>
<ul><li>Smoking</li><li>Poor diet</li><li>High blood pressure</li><li>Alcohol use</li><li>Family history</li></ul>
<p>More risk factors = higher probability of disease. Probability helps doctors recommend preventive measures.</p>
<p>Example: If you have 3 risk factors vs 1, your probability of heart disease is significantly higher.</p>`},

{t:"Cosmic Scale (Powers of 10)",c:`<h4>Orders of Magnitude</h4>
<p>A <span class="key">logarithmic scale</span> — each step ×10.</p>
<ul><li>10⁰ = 1 m (baseball bat)</li><li>10¹ = 10 m (tall tree)</li><li>10⁻¹ = 0.1 m</li></ul>
<h4>Cosmic Scale (biggest → smaller)</h4>
<ul><li><span class="key">Observable universe</span>: 10²⁷ m (~93 billion light-years). May be more beyond!</li>
<li><span class="key">Galaxy filaments</span>: 10²⁴ m — web-like strings up to 260 million light-years. Ours: Pisces-Cetus Supercluster Complex</li>
<li><span class="key">Galaxy superclusters</span>: 10²⁴ m (~10 million in observable universe). Ours: Virgo Supercluster</li>
<li><span class="key">Galaxy clusters</span>: 100-1000 galaxies</li>
<li><span class="key">Galaxy groups</span>: ≤50 galaxies. Ours: Local Group (10²² m)</li>
<li><span class="key">Milky Way</span>: 10²¹ m</li>
<li><span class="key">Solar system</span>: 10¹³ m</li></ul>
<div class="note">A light-year = 9.46 trillion km. Light speed ≈ 300,000 km/s. Seeing distant stars = seeing the PAST!</div>`},

{t:"Human & Atomic Scale",c:`<h4>Human Scale (10⁶ to 10⁻⁶)</h4>
<p>Mountains → sand grains. Uses km, m, cm, mm, μm. Cloud droplet ≈ 10 μm.</p>
<h4>Cellular & Atomic Scale</h4>
<ul><li><span class="key">Nanometre (nm)</span>: 10⁻⁹ m — DNA helix = 2 nm</li>
<li><span class="key">Picometre (pm)</span>: 10⁻¹² m — gamma ray wavelength</li>
<li><span class="key">Femtometre (fm)</span>: 10⁻¹⁵ m — atom nucleus (1.75-15 fm)</li>
<li>Electron: ~1 <span class="key">attometre (am)</span>: 10⁻¹⁸ m</li>
<li><span class="key">Planck length</span>: 10⁻³⁵ m — smallest measurable. Physics breaks down below this!</li></ul>
<h4>3 Microscope Types</h4>
<ul><li><span class="key">Optical</span> — lenses, limit ~250 nm</li>
<li><span class="key">Electron</span> — electron beams, limit ~220 pm</li>
<li><span class="key">Scanning Probe</span> — quantum tunnelling, sees atoms ~100 pm</li></ul>
<div class="note"><span class="key">Heisenberg Uncertainty Principle</span>: Can't know both exact position AND speed of a particle simultaneously! Quantum mechanics powers semiconductors, lasers, MRI machines.</div>`},

{t:"Networks: Basics & Types",c:`<h4>What is a Network?</h4>
<p>Connected objects. In math = <span class="key">graph</span>. Math of networks = <span class="key">graph theory</span>.</p>
<ul><li><span class="key">Nodes (vertices)</span> — objects</li>
<li><span class="key">Edges</span> — connections</li>
<li>Connected nodes = <span class="key">neighbours</span></li>
<li><span class="key">Degree</span> — number of edges on a node</li></ul>
<h4>Types</h4>
<ul><li><span class="key">Undirected</span> — both ways (friendships)</li>
<li><span class="key">Directed</span> — one direction (food chains, website links)</li>
<li><span class="key">Weighted</span> — nodes/edges have different sizes (more followers = bigger node)</li></ul>`},

{t:"Adjacency Matrices & Euler",c:`<h4>Adjacency Matrices</h4>
<p>Networks as math tables. 1 = connected, 0 = not. A node can't connect to itself (diagonal = zeros).</p>
<ul><li><span class="key">Undirected</span>: matrix is <span class="key">symmetrical</span> — rows and columns add same</li>
<li><span class="key">Directed</span>: NOT symmetrical. 1s in ROW = connections going TO. 1s in COLUMN = connections coming FROM.</li></ul>
<h4>Euler's Discovery</h4>
<p><span class="key">Königsberg Bridge Problem</span> (1736): Cross all 7 bridges exactly once? <span class="key">Euler proved IMPOSSIBLE.</span></p>
<div class="formula">Euler path exists ONLY if 0 or 2 nodes have odd degree</div>`},

{t:"Networks in Nature & Technology",c:`<h4>Natural Networks</h4>
<ul><li><span class="key">Food webs</span> — directed networks (energy flow between species)</li>
<li><span class="key">Mycelia/fungal networks</span> — thin fungal branches connect tree roots underground → share water and nutrients</li>
<li><span class="key">Bee communication</span> — social network in hives</li>
<li><span class="key">Animal social networks</span> — giraffes, orcas, guppies, macaques</li>
<li><span class="key">Brain</span> — neurons = nodes, electrical impulses = edges. 2021: Harvard + Google mapped neurons in brain piece size of a pinhead (5,000 slices with electron microscope!)</li></ul>
<h4>Technological Networks</h4>
<ul><li><span class="key">Computer networks</span> — share info quickly. Internet = massive network</li>
<li><span class="key">P2P (peer-to-peer)</span> — computers share files directly. Bitcoin uses P2P!</li>
<li>GPS routing, social media friend recommendations</li></ul>
<div class="note">Brain mapping inspired the machine learning algorithm called <span class="key">neural networking</span>.</div>`},

{t:"Inflation: Basics",c:`<h4>What is Inflation?</h4>
<p>Rise in prices of goods/services over time. <span class="key">Goods</span> = physical (food, gas, toys). <span class="key">Services</span> = activities (banking, car repair, concerts).</p>
<div class="formula">New price = Original × (1 + inflation rate)</div>
<p>$100 item, 2% inflation → $102 next year.</p>
<h4>Causes</h4>
<ul><li><span class="key">Supply and demand</span> — low supply + high demand → prices up</li>
<li>Wars, pandemics, natural disasters → damage infrastructure → harder to transport → prices rise</li>
<li>World oil supply — less oil → everything more expensive</li>
<li>Interest rates set by banks</li></ul>
<h4>Effects</h4>
<p><span class="key">Purchasing power</span> = how much you buy with set amount. Inflation rises but income doesn't → purchasing power DOWN.</p>`},

{t:"Fighting Inflation & 6 Rs",c:`<h4>3 Strategies</h4>
<ol><li><span class="key">Budget</span> — plan income + expenses (needs AND wants)</li>
<li><span class="key">Smart spending</span> — avoid impulse buys, buy quality (lasts longer), wait for sales, buy second-hand</li>
<li><span class="key">Make money go further</span> — repair don't replace, walk/bike, keep working phone</li></ol>
<h4>Practice Problems</h4>
<p>$50 toy, 3% inflation: 50 × 1.03 = $51.50. Purchasing power decreased $1.50.</p>
<p>Store A: $48 × 0.75 = $36. Store B: $52 - $15 = $37. Store C: $45 × 2/3 = $30. Best deal: Store C!</p>
<h4>6 Rs of Sustainability</h4>
<p><span class="key">Reduce, Reuse, Refuse, Repair, Recycle, Rethink</span> — help fight inflation AND help the environment!</p>`},

{t:"Data as Art & Accessibility",c:`<h4>Data as Art</h4>
<p>Scientists and artists work together — charts, posters, infographics. Artists use real data to inspire work.</p>
<h4>Creating Data Art</h4>
<ol><li>Pick a topic/question</li><li>Collect data (surveys, observations, existing databases)</li><li>Analyze patterns</li><li>Choose an art form (painting, sculpture, digital)</li><li>Consider audience, message, colours, textures</li><li>Create and share!</li></ol>
<h4>Tools for Collecting Data</h4>
<ul><li>Polls and surveys</li><li>Observation/data sheets</li><li>Government databases (e.g., Canada climate data)</li></ul>
<p>Creative thinking + problem-solving = important for ALL careers (scientist, artist, engineer, anything!).</p>`},

{t:"The Moon: Basics",c:`<p>The Moon doesn't produce light — it <span class="key">reflects sunlight</span>. The rocks and dust are mostly grey/white.</p>
<p>Moon's orbit is <span class="key">elliptical (oval)</span>. Closest = <span class="key">perigee</span> (stronger gravity → higher tides, Moon looks bigger). Farthest = <span class="key">apogee</span> (Moon looks smaller). <span class="key">Supermoon</span> = full moon at perigee.</p>
<p>Moon orbits Earth in ~27.3 days (<span class="key">sidereal month</span>) and rotates once in ~27.3 days = <span class="key">synchronous rotation</span> (always see same side). Earth's gravity gradually slowed Moon's rotation = <span class="key">tidal locking</span>.</p>
<h4>Lunar Day/Night</h4>
<ul><li>Lunar day = <span class="key">14 Earth days</span> of sunlight</li><li>Lunar night = 14 Earth days darkness</li><li>Temp: <span class="key">127°C (day) to -173°C (night)</span>. Some craters: -250°C</li></ul>
<div class="note">The Moon is moving AWAY from Earth! Someday it will be too small to cause total solar eclipses.</div>`},

{t:"Moon Phases (8 in order)",c:`<h4>4 Primary + 4 Secondary Phases</h4>
<ol><li><span class="key">New Moon</span> — not visible (between Earth and Sun)</li>
<li><span class="key">Waxing Crescent</span></li>
<li><span class="key">First Quarter</span> (right half lit)</li>
<li><span class="key">Waxing Gibbous</span></li>
<li><span class="key">Full Moon</span></li>
<li><span class="key">Waning Gibbous</span></li>
<li><span class="key">Third Quarter</span> (left half lit)</li>
<li><span class="key">Waning Crescent</span></li></ol>
<p><span class="key">Waxing</span> = growing (looks like D). <span class="key">Waning</span> = shrinking (looks like C).</p>
<p>The phase depends on our position on Earth relative to the Moon and Sun. One side of the Moon ALWAYS faces the Sun — it's OUR viewing angle that changes.</p>`},

{t:"Eclipses",c:`<h4>Lunar Eclipse</h4>
<p>Earth comes directly between Sun and Moon → Earth's shadow falls on Moon. Happens during <span class="key">FULL moon</span>.</p>
<ul><li>Sun is much larger than Earth → sunlight goes AROUND Earth → some red light bends through atmosphere onto Moon</li>
<li>Moon turns reddish = <span class="key">Blood Moon</span> (same reason sunsets are red — atmosphere scatters blue, bends red)</li>
<li>Dust, water, and pollution in atmosphere affect the redness</li>
<li><span class="key">Total lunar eclipse</span> = Moon entirely in Earth's shadow (umbra). <span class="key">Partial</span> = only part in shadow (penumbra).</li></ul>
<h4>Solar Eclipse</h4>
<p>Moon blocks the Sun. Happens during <span class="key">NEW moon</span>.</p>
<h4>Why Not Every Month?</h4>
<p>Moon's orbit is <span class="key">tilted ~5°</span> relative to Earth's orbit around the Sun. Most months, Moon passes ABOVE or BELOW Earth's shadow. Only when orbits align do eclipses happen (~2 per year).</p>`},

{t:"Moon Formation: Giant Impact Theory",c:`<p>~4.5 billion years ago, Mars-sized object called <span class="key">Theia</span> collided with early Earth.</p>
<h4>Evidence</h4>
<p>Apollo rocks are <span class="key">chemically very similar</span> to Earth rocks, but DIFFERENT from Mars rocks and meteorites → Moon material likely came from Earth. Scientists use computer models and simulations to work backwards from this evidence.</p>
<h4>3 Scenarios</h4>
<ul><li><span class="key">Scenario 1: Theia grazed Earth</span> → debris disc (like Saturn's rings) → clumped into Moon. Problem: Moon would be mostly Theia material, not similar to Earth.</li>
<li><span class="key">Scenario 2: Multiple smaller impacts</span> → each created moonlets → combined over time. Same problem — Moon would be made of impactors.</li>
<li><span class="key">Scenario 3: Both shattered completely</span> → mixed into a <span class="key">synestia</span> (rotating donut-shaped cloud of hot material) → center cooled to Earth, outer parts became Moon. <span class="key">BEST explanation</span> — explains why rocks match! Latest simulations: Moon may have formed in HOURS, not millions of years.</li></ul>
<h4>Early Moon</h4>
<p>Extremely hot at first — surface was a <span class="key">magma ocean</span> (molten rock). Over ~100 million years it solidified. Lighter rocks floated up (became <span class="key">lunar crust</span>), heavier rocks sank.</p>
<p>Artemis missions plan to collect more samples to further test these scenarios.</p>`},

{t:"Moon Rocks",c:`<h4>Apollo Samples</h4>
<p>Six Apollo missions (1969–1972) brought back <span class="key">382 kg</span> of rocks and soil. Almost all are <span class="key">igneous</span> (no wind/water = no sedimentary rock!). New tools on Earth still allow scientists to make discoveries from these samples decades later — many remain in pristine condition.</p>
<h4>3 Main Types</h4>
<ul><li><span class="key">Basalts</span> — dark flat plains called <span class="key">maria</span> (Latin: "seas"). Rich in <span class="key">iron and titanium</span>. Small holes from gas bubbles trapped during cooling.</li>
<li><span class="key">Anorthosites</span> — bright highlands called <span class="key">terrae</span> (Latin: "land"). Rich in <span class="key">aluminum, calcium, silicon</span>.</li>
<li><span class="key">Breccia</span> — fragments fused together from impacts. Very fragile! Rich in <span class="key">uranium, thorium, potassium</span>.</li></ul>
<div class="note">A new mineral called <span class="key">armalcolite</span> was discovered in Apollo 11 rocks — named after astronauts Armstrong, Aldrin, and Collins!</div>`},

{t:"Water on the Moon",c:`<h4>Discovery Timeline</h4>
<ul><li><span class="key">Late 1990s</span> — Lunar Prospector found large amounts of hydrogen at Moon's poles (H is part of H₂O)</li>
<li><span class="key">2008</span> — India's <span class="key">Chandrayaan-1</span> carried NASA's Moon Mineralogical Mapper (M3) → discovered ice INSIDE polar craters</li>
<li><span class="key">2009</span> — <span class="key">LCROSS</span> (Lunar Crater Observation and Sensing Satellite): The Centaur rocket was crashed into <span class="key">Cabeus crater</span> (south pole) → kicked up cloud of lunar material → LCROSS flew through and detected <span class="key">155 kg of water</span> before also crashing</li>
<li><span class="key">2020</span> — <span class="key">SOFIA</span> (Stratospheric Observatory for Infrared Astronomy, mounted on Boeing 747) detected water molecules on the <span class="key">sunlit surface</span> in <span class="key">Clavius Crater</span> (one of largest visible from Earth). Proved water exists OUTSIDE permanently shadowed regions! SOFIA ended scientific flights Sep 29, 2022.</li></ul>
<h4>How Water Got There (3 theories)</h4>
<ol><li>From Moon's formation (Giant Impact — originally from Earth)</li>
<li>Delivered by asteroids or comets</li>
<li>Created by <span class="key">solar winds</span> combining oxygen + hydrogen on the surface</li></ol>
<h4>Why It Matters</h4>
<p>Transporting supplies costs <span class="key">$10,000–$20,000/kg</span> from Earth. Lunar water can provide drinking water, oxygen to breathe, and even rocket fuel (hydrogen).</p>
<div class="note">The Sahara desert has <span class="key">100× more water</span> than SOFIA found on the Moon!</div>`},

{t:"Impact Craters: Formation",c:`<h4>What Are SSSBs?</h4>
<p><span class="key">Small Solar System Bodies (SSSBs)</span> include asteroids and comets that zip around our solar system. <span class="key">Asteroids</span> = rock/metal (mostly between Mars and Jupiter). <span class="key">Comets</span> = ice mixed with rock (from outer solar system). NOT the same thing!</p>
<h4>How Craters Form</h4>
<p>SSSB hits surface at high speed → like a huge bomb → energy spreads equally in all directions → <span class="key">circular crater</span> regardless of impactor shape. Only very low angles (<15°) create oval craters. Impacts between 45–90° (straight down) = perfectly circular.</p>
<h4>5 Factors Affecting Size/Shape</h4>
<ol><li><span class="key">Mass</span> of impactor — heavier = bigger crater</li>
<li><span class="key">Density</span> — denser objects transfer more force</li>
<li><span class="key">Velocity</span> — faster = more energy = wider + deeper</li>
<li><span class="key">Angle</span> — low angles create oval shapes</li>
<li><span class="key">Surface geology</span> — soft rock = easier to displace, hard rock resists</li></ol>
<div class="note">The Moon's <span class="key">South Pole–Aitken Basin</span> is ~2,500 km across — big enough to stretch across Canada coast to coast!</div>`},

{t:"Impact Craters: Parts & Types",c:`<h4>6 Parts of a Crater</h4>
<ul><li><span class="key">Floor</span> — bottom (flat or bowl-shaped, below surrounding ground)</li>
<li><span class="key">Walls</span> — steep interior sides (may collapse into steps over time due to gravity)</li>
<li><span class="key">Rim</span> — raised top edge (ground pushed up during impact)</li>
<li><span class="key">Central peak</span> — material rebounds to center after impact (large craters only)</li>
<li><span class="key">Ejecta</span> — thrown-out rock (thickest near crater, thins outward)</li>
<li><span class="key">Rays</span> — bright streaks extending outward (like rays from the Sun)</li></ul>
<h4>3 Types</h4>
<ul><li><span class="key">Simple</span> — small, bowl-shaped, smooth walls</li>
<li><span class="key">Complex</span> — larger, central peaks, stepped sides (e.g., Copernicus Crater on Moon)</li>
<li><span class="key">Impact basins</span> — >300 km diameter (look like large dark areas from Earth)</li></ul>
<h4>Why Moon Craters Last, Earth's Don't</h4>
<p>Moon: no atmosphere, no wind, no water, no plate tectonics → craters preserved for billions of years. Earth: weathering, erosion, plate tectonics erases craters. Only <span class="key">~190–200 identified</span> on Earth vs millions on Moon.</p>`},

{t:"Canadian Impact Craters",c:`<ul><li><span class="key">Sudbury Basin</span> (Ontario) — largest in Canada (~62 × 30 km). Rich in nickel/copper — major mining area!</li>
<li><span class="key">Clearwater Lakes</span> (Quebec, near Hudson Bay) — twin craters filled with water. West = 36 km, East = 26 km. NOT a double impact — formed ~4 million years apart (~290 million years ago)!</li>
<li><span class="key">Mistastin Crater</span> (Labrador) — ~36 million years ago. Original crater ~28 km, now smaller from glacial erosion. Island in the middle = central peak (complex crater!). Impact generated <span class="key">2,370°C</span> = HOTTEST temperature ever recorded on Earth's surface! Known from heat-signature minerals.</li>
<li><span class="key">Pingualuit Crater</span> (Ungava Peninsula, Quebec) — ~1.4 million years old. 3.4 km diameter, 400 m deep. Lake inside = 267 m deep = one of deepest in North America! So clear that local Inuit call it "<span class="key">Crystal Eye of Nunavik</span>". "Pingualuit" = Inuktitut for "where the land rises".</li></ul>`},

{t:"Lunar Rover Challenges",c:`<h4>1. Darkness</h4>
<p>14-day nights + <span class="key">permanently shadowed regions (PSRs)</span> at poles. Rovers use <span class="key">solar panels</span> (breakable! launches are shaky). Can recharge via <span class="key">wireless charging</span> from lunar lander (WiBotic chosen by NASA). PSR exploration needs battery reserves.</p>
<h4>2. Extreme Cold</h4>
<p>127°C day to -173°C night. Hermite Crater: -250°C (coldest in Solar System!). Rovers use:</p>
<ul><li><span class="key">Gold paint</span> — prevents heat transfer by radiation (like thermos bottles)</li>
<li><span class="key">Aerogel</span> insulation — 99.8% air, lightweight</li>
<li><span class="key">Heaters</span> with thermostats + heat rejection systems (like car AC)</li></ul>
<h4>3. Cosmic Radiation</h4>
<p>Moon has no atmosphere and very weak magnetic field. Surface = <span class="key">200–1000× more radiation</span> than Earth (2.5× the ISS!). Radiation damages computer chips, wipes memory, makes wiring brittle. Solution: <span class="key">shielded wires</span> and <span class="key">radiation hardening</span>.</p>
<h4>4. Challenging Terrain</h4>
<p>Rocky, steep craters. <span class="key">DuAxel</span> (NASA JPL) = two 2-wheeled vehicles tethered together — one anchors while other explores steep slopes.</p>
<h4>5. Lunar Dust (Regolith)</h4>
<p>Sharp like glass (no weathering to smooth it!), has <span class="key">static charge</span> (sticks to everything). Clogs cameras, mechanical parts, lungs. Solutions: electrical charges to repel dust, dust-resistant coatings.</p>
<h4>Wheels</h4>
<p>Rubber tires won't work — extreme cold would make rubber shatter like glass! Special metal/composite wheels with good treads needed. Regolith is very powdery/slippery.</p>`},

{t:"Famous Lunar Rovers (Timeline)",c:`<ul><li><span class="key">Lunokhod 1 & 2</span> (Soviet Union, 1970–73) — FIRST rovers on another world!</li>
<li><span class="key">Apollo Lunar Roving Vehicle (LRV)</span> (USA, 1971–72) — electric "Moon buggy" driven by astronauts. 36 km/h max. Used on Apollo 15, 16, 17.</li>
<li><span class="key">Yutu-1</span> (China, 2013) — Chang'e 3 mission</li>
<li><span class="key">Yutu-2</span> (China, 2019–present) — Chang'e 4. First rover on the <span class="key">FAR SIDE</span> of the Moon!</li>
<li><span class="key">Pragyan</span> (India, 2023) — Chandrayaan-3. First rover near Moon's <span class="key">SOUTH POLE</span>!</li></ul>
<h4>Canadian Rover</h4>
<p><span class="key">Canadensys Aerospace Corporation</span> (Stratford, Ontario) selected in November 2022 to build first Canadian lunar rover. Will carry <span class="key">6 science instruments</span> (5 Canadian, 1 American). Will explore south pole, study hydrogen/water, soil properties, radiation. Expected launch: <span class="key">2029</span> (Firefly Aerospace Blue Ghost Mission 4). Will start remotely controlled, then become <span class="key">autonomous</span> (makes own decisions!).</p>`},

{t:"Artemis Program & Canada",c:`<h4>What is Artemis?</h4>
<p>NASA-led program to return humans to the Moon. Canada signed the <span class="key">Artemis Accords</span> (Oct 2020) — 20+ countries for peaceful lunar exploration. Goal: prepare for <span class="key">long-term human exploration</span> including Mars.</p>
<h4>Artemis Missions</h4>
<ul><li><span class="key">Artemis I</span> (Nov 16 – Dec 11, 2022) — test flight, NO crew. Orion spacecraft + SLS rocket. Orbited Moon and returned safely. ✅ Success.</li>
<li><span class="key">Artemis II</span> — FIRST crewed Moon mission since 1972! 4 astronauts including <span class="key">Canadian astronaut Jeremy Hansen</span> (London, ON). Canada = only 2nd country to fly astronaut around Moon!</li>
<li><span class="key">Artemis III</span> — 4 astronauts, expected to include a woman and person of colour. Two will land on surface for experiments and samples.</li></ul>
<h4>Lunar Gateway</h4>
<p>New space station orbiting the Moon (~1/6 size of ISS). 4 astronauts for up to 3 months. Trips to lunar surface for research.</p>
<h4>Canadarm3</h4>
<p>Canada's contribution. <span class="key">One long arm + one short arm + detachable tools</span>. Uses <span class="key">AI to operate autonomously</span> when no crew aboard. Can grab/move vehicles, help spacewalks, inspect/repair station. Designed since 2014, launch planned ≥2029. Built by <span class="key">MDA</span> (Brampton, Ontario).</p>
<h4>Aqualunar Challenge</h4>
<p>Encourages Canadians to develop lunar water purification technology.</p>`},

{t:"Space Benefits for Earth & Inspiration",c:`<h4>How Space Exploration Helps Earth</h4>
<ul><li><span class="key">Healthcare</span> — astronaut monitoring devices used on Earth, robotic surgery based on Canadarm2, telemedicine</li>
<li><span class="key">Food production</span> — growing food in extreme environments helps Northern Canadian communities</li>
<li><span class="key">Earth observation</span> — satellites for security, climate, navigation, disaster prevention</li>
<li><span class="key">Employment</span> — ~22,000 Canadians in space sector (2023), $5.0 billion revenue (2022)</li>
<li><span class="key">Partnerships</span> — brings nations together peacefully; Canada = world leader in space robotics</li></ul>
<h4>Canadian Astronauts</h4>
<ul><li><span class="key">Jeremy Hansen</span> — Artemis II crew. Fighter pilot. First Canadian to lead a NASA astronaut class (2017).</li>
<li><span class="key">Jenni Gibbons</span> — Artemis II backup. "I would absolutely want to be the first woman on the Moon."</li>
<li><span class="key">Joshua Kutryk</span> — first CSA astronaut in NASA Commercial Crew Program.</li>
<li><span class="key">David Saint-Jacques</span> — longest Canadian space mission (204 days on ISS, 2018-19). Helped design Canadarm3.</li>
<li><span class="key">Chris Hadfield</span> — first Canadian to command ISS (2013). Attached Canadarm2.</li>
<li><span class="key">Julie Payette</span> — flew on Discovery (1999) and Endeavour (2009). Governor General 2017-2021.</li></ul>
<p><span class="key">Earthrise</span> photo (Apollo 8, 1968) — first colour photo of Earth from space. Helped start environmental movement. First Earth Day: April 22, 1970.</p>`},
